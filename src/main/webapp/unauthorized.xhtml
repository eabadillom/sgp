<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
      
      <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
            <meta name="apple-mobile-web-app-capable" content="yes" />
        </f:facet>
        <title>Sistema de Gestión de Personal</title>
    </h:head>
    
    <h:body styleClass="exception-body">
    	<h:outputStylesheet name="css/layout-#{guestPreferences.layout}.css" library="omega-layout"/>
    	<h:form>
	        <div class="exception-wrapper error">
	            <p:graphicImage name="images/error.png" library="omega-layout" />
	            
	            <p class="message-title">No autorizado</p>
	            <p class="message-summary">No tiene permiso para acceder a este recurso.</p>
	            
	            <div class="login-footer">©FERBO Todos los derechos reservados.</div>
	        </div>
	        
	        <div align="center" style="padding-top: 3rem;">
		        <p:commandButton value="Ir al kardex" icon="pi pi-home" actionListener="#{unauthorizedBean.redirect}" styleClass="ui-button-secondary">
	            </p:commandButton>
	        </div>
    	</h:form>
    </h:body>
</html>
