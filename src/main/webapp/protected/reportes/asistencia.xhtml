<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">Asistencia</ui:define>
    <ui:define name="content">
        <script>
            PrimeFaces.locales['es'] = {
                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
                dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
                weekHeader: 'Semana',
                firstDay: 1,
                isRTL: false,
                showMonthAfterYear: false,
                yearSuffix: '',
                timeOnlyTitle: 'Sólo hora',
                timeText: 'Tiempo',
                hourText: 'Hora',
                minuteText: 'Minuto',
                secondText: 'Segundo',
                millisecondText: 'Milisegundo',
                ampm: false,
                month: 'Mes',
                week: 'Semana',
                day: 'Día',
                allDayText: 'Todo el día',
                today: 'Hoy',
                now: 'Ahora',
                clear: 'Limpiar',
                aria: {
                    close: 'Cerrar',
                    previous: 'Anterior',
                    next: 'Siguiente',
                }
            };
        </script>
        <h:form id="form" enctype="multipart/form-data">
            <p:growl id="messages" showDetail="true" life="2000"/>
            <p:dialog modal="true" widgetVar="statusInfoDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
                <div align="center">
                    <i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
                </div>
            </p:dialog>
            <div class="ui-fluid">
                <p:panelGrid id="pnl-buscar" columns="4" layout="grid">
                    <p:selectOneMenu id="sel-planta" value="#{repAsistenciaBean.planta}" converter="entityConverter" autoWidth="false">
                        <f:selectItem itemLabel="Todas las plantas"></f:selectItem>
                        <f:selectItems value="#{repAsistenciaBean.plantas}" var="planta" itemLabel="#{planta.descripcion}" itemValue="#{planta}"></f:selectItems>
                    </p:selectOneMenu>
                    <p:datePicker showIcon="true" placeholder="Del: dd/mm/aaaa" value="#{repAsistenciaBean.fechaInicio}" locale="es" pattern="dd/MM/yyyy" timeZone="GMT-6" readonly="false">
                        <p:ajax event="dateSelect" listener="#{repAsistenciaBean.ajustaHoras}" process="@this"></p:ajax>
                    </p:datePicker>
                    <p:datePicker showIcon="true" placeholder="Del: dd/mm/aaaa" value="#{repAsistenciaBean.fechaFin}" locale="es" pattern="dd/MM/yyyy" timeZone="GMT-6" readonly="false">
                        <p:ajax event="dateSelect" listener="#{repAsistenciaBean.ajustaHoras}" process="@this"></p:ajax>
                    </p:datePicker>
                    <p:commandButton value="Buscar" icon="pi pi-search" process="pnl-buscar @this" update="dt-registros :form:cmd-exportar-pdf" actionListener="#{repAsistenciaBean.cargaInfo}" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
                </p:panelGrid>
            </div>
            <div style="padding-top: 1rem;">
                <p:dataTable id="dt-registros" value="#{repAsistenciaBean.registros}" var="registro" lazy="true" rows="10" paginator="true">
                    <p:column headerText="Empleado" sortBy="#{registro.idEmpleado.nombre}">
                        <p:outputLabel value="#{registro.idEmpleado.nombre} #{registro.idEmpleado.primerAp} #{registro.idEmpleado.segundoAp}"/>
                    </p:column>
                    <p:column headerText="Fecha" style="width: 6rem; text-align: center;" sortBy="#{registro.fechaEntrada}">
                        <p:outputLabel value="#{registro.fechaEntrada}">
                            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Entrada" style="width: 6rem; text-align: center;" sortBy="#{registro.fechaEntrada}">
                        <p:outputLabel value="#{registro.fechaEntrada}">
                            <f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6" locale="es_MX"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Salida" style="width: 6rem; text-align: center;" sortBy="#{registro.fechaSalida}">
                        <p:outputLabel value="#{registro.fechaSalida}">
                            <f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6" locale="es_MX"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Status" style="width: 6rem;">
                        <p:badge value="#{repAsistenciaBean.obtenerEstatusAsistencia(registro)}" severity="#{repAsistenciaBean.badgeColor}"></p:badge>
                    </p:column>
                    <p:column style="width: 2rem;">
                        <p:commandButton icon="pi pi-bars" actionListener="#{repAsistenciaBean.editarRegistro(registro)}" oncomplete="PF('dgEditarRegistro').show();" update="form:pnl-registro" process="@this"/>
                    </p:column>
                </p:dataTable>
            </div>
            <div align="center" style="padding-top: 1rem;">
                <p:panel id="cmd-exportar-pdf">
                    <div style="padding-left: 1rem; padding-right: 1rem; display: inline-block;">
                        <p:commandButton value="Exportar a PDF" icon="pi pi-file-pdf" ajax="false" rendered="#{not empty repAsistenciaBean.registros}" actionListener="#{repAsistenciaBean.exportarPDF}">
                            <p:fileDownload value="#{repAsistenciaBean.pdfFile}"/>
                        </p:commandButton>
                    </div>
                    <div style="padding-left: 1rem; padding-right: 1rem; display: inline-block;">
                        <p:commandButton value="Exportar a Excel" icon="pi pi-file-excel" ajax="false" rendered="#{not empty repAsistenciaBean.registros}" actionListener="#{repAsistenciaBean.exportarXLS}">
                            <p:fileDownload value="#{repAsistenciaBean.xlsFile}"/>
                        </p:commandButton>
                    </div>
                </p:panel>
            </div>
            <p:dialog header="Registro de asistencia" widgetVar="dgEditarRegistro" showEffect="fade" modal="true" responsive="true" draggable="true" resizable="false" dynamic="true">
                <p:outputPanel id="pnl-registro" class="ui-fluid" rendered="#{repAsistenciaBean.registroSelected ne null}">
               		<div class="p-field">
               			<p:outputLabel value="Fecha" />
               			<p:inputText value="#{repAsistenciaBean.registroSelected.fechaEntrada}" readonly="true">
               				<f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX" />
               			</p:inputText>
               		</div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Entrada"/>
                        <p:datePicker id="fechaEntrada" value="#{repAsistenciaBean.registroSelected.fechaEntrada}"
                        				timeOnly="true"
										pattern="dd-MM-yyyy" readonlyInput="false" timeZone="GMT-6" styleClass="ferbo-datePicker" 
										panelStyleClass="ferbo-datePicker-panel" disabled="false" inline="true" showTime="true" timeInput="true" disabledDates="#{repAsistenciaBean.diasDesabilitados}" />
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Salida"/>
                        <p:datePicker id="fechaSalida" value="#{repAsistenciaBean.registroSelected.fechaSalida}"
										timeOnly="true"
										pattern="dd-MM-yyyy" readonlyInput="false" timeZone="GMT-6" styleClass="ferbo-datePicker" 
										panelStyleClass="ferbo-datePicker-panel" disabled="false" inline="true" showTime="true" timeInput="true" disabledDates="#{repAsistenciaBean.diasDesabilitados}" />
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Estatus del registro"/>
                        <p:selectOneMenu id="EstatusRegistro" value="#{repAsistenciaBean.registroSelected.idEstatus}" converter="entityConverter">
                            <f:selectItems value="#{repAsistenciaBean.lstEstatus}" var="estatusregistro" itemLabel="#{estatusregistro.descripcion}" itemValue="#{estatusregistro}"/>
                            <p:ajax process="@this"/>
                        </p:selectOneMenu>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{repAsistenciaBean.actualizarRegistro()}" update="form" oncomplete="PF('dgEditarRegistro').hide()"/>
                    <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-danger" actionListener="#{repAsistenciaBean.restablecerValores()}" update="form" oncomplete="PF('dgEditarRegistro').hide()" ajax="true" process="@this"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
    <style>
        .ferbo-datePicker .ui-datepicker-calendar td a.ui-state-active{
            background: #77ff00 !important;
        }
    </style>
</ui:composition>
