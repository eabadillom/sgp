<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    
    <p:toolbar styleClass="mb-4">
        <p:toolbarGroup id="grupoBotonesRegistro" align="center">
            <div class="ui-fluid" >
                <div class="formgrid grid">
                    <div class="field col-12 md:col-3">
                        <p:outputLabel for="@next" value="Periodo Inicio" />
                        <p:datePicker value="#{incidenciaBean.inicio}" showIcon="true" locale="es" timeZone="GMT-6" pattern="dd/MM/yyyy">
                            <p:ajax update="dtRegistro" process="@this" />
                        </p:datePicker>
                    </div>
                    <div class="field col-12 md:col-3">
                        <p:outputLabel for="@next" value="Periodo Fin" />
                        <p:datePicker  value="#{incidenciaBean.fin}" showIcon="true" locale="es" timeZone="GMT-6" pattern="dd/MM/yyyy">
                            <p:ajax update="dtRegistro" process="@this" />
                        </p:datePicker>
                    </div>
                </div>
            </div>
        </p:toolbarGroup>
    </p:toolbar>
    <p:dataTable id="dtRegistro" widgetVar="dtRegistro" value="#{incidenciaBean.consultarRegistros()}" selection="#{incidenciaBean.listRegistroFiltrada}"
                 var="registro" rowKey="#{registro.idRegistro}" paginator="true" rows="10" paginatorPosition="bottom" reflow="true">
        <f:facet name="header">
            <div class="flex justify-content-start">
                <p:inputText id="filtarNombre" value="#{incidenciaBean.empleadoAsistenciaTXT}" onkeyup="PF('dtRegistro').filter()" style="width:300px" 
                             placeholder="Buscar empleado por nombre o apellidos">
                    <p:ajax update="dtRegistro" process="@this"/>
                </p:inputText>
            </div>
        </f:facet>
        <p:column headerText="Nombre" width="8rem">
            <p:outputLabel value="#{registro.idEmpleado.nombre} #{registro.idEmpleado.primerAp} #{registro.idEmpleado.segundoAp}"/>
        </p:column>
        <p:column headerText="Fecha" width="5rem">
            <p:outputLabel value="#{registro.fechaEntrada}">
                <f:convertDateTime type="date" pattern="dd/MM/yyyy" />
            </p:outputLabel>
        </p:column>
        <p:column headerText="Estatus" width="5rem">
            <p:outputLabel class="customer-badge status-#{incidenciaBean.status.getEstatusRegistro(registro.idEstatus.codigo)}"
                           value="#{registro.idEstatus.descripcion}" style="display: block; width: 7rem"/>
        </p:column>
        <p:column exportable="false" style="text-align: center" width="20px">
            <p:commandButton icon="pi pi-bars" class="ui-button-success rounded-button m-1" styleClass="edit-button" process="@this"
                             action="#{incidenciaBean.editarRegistro(registro)}" update="formIncidencias:tabViewI:pnlRegisto"
                             oncomplete="PF('dialogRegistro').show();">
                <f:setPropertyActionListener value="#{registro}" target="#{incidenciaBean.registro}" for="@previous"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>
    <p:dialog id="dialogRegistro" widgetVar="dialogRegistro" header="Detalle Registro" showEffect="fade" responsive="true" modal="true" 
              styleClass="ferbo-dialog" dynamic="true" cache="false" style="margin: auto" >
        <p:outputPanel id="pnlRegisto" styleClass="ui-fluid">
            <div class="formgrid grid" >
                <div class="field col" >
                    <p:outputLabel for="@next" value="Nombre: " style="width: 15rem" />
                    <p:inputText value="#{incidenciaBean.registro.idEmpleado.nombre} #{incidenciaBean.registro.idEmpleado.primerAp} #{incidenciaBean.registro.idEmpleado.segundoAp}" disabled="true" />
                </div>
            </div>
            <div class="formgrid grid" >
                <div class="field col" >
                    <p:outputLabel for="@next" value="Fecha: " style="width: 4rem" />
                    <p:inputText value="#{incidenciaBean.registro.fechaEntrada}" disabled="true" >
                        <f:convertDateTime type="date" pattern="dd/MM/yyyy" />
                    </p:inputText>
                </div>
            </div>
            <div class="formgrid grid" >
                <div class="field col" >
                    <p:outputLabel for="@next" value="Estatus: " style="width: 4rem" />
                    <p:inputText class="customer-badge status-#{incidenciaBean.status.getEstatusRegistro(incidenciaBean.registro.idEstatus.codigo)}" 
                                   value="#{incidenciaBean.registro.idEstatus.descripcion}" disabled="true" />
                </div>
            </div>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Justificar Retardo" icon="pi pi-check" class="ui-button-info" oncomplete="PF('dialogoJustificar').show()"
                             process="pnlRegisto @this" update="formIncidencias:tabViewI:pnlRegisto formIncidencias:tabViewI:dtRegistro">
                <p:resetInput target="formIncidencias:tabViewI:dialogRegistro" />
            </p:commandButton>
            <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogoRegisto').hide()" class="ui-button-secondary" >
                <p:resetInput target="formIncidencias:tabViewI:pnlRegisto" />
            </p:commandButton>
        </f:facet>
    </p:dialog>
    <p:confirmDialog widgetVar="dialogoJustificar" showEffect="fade" width="300"
        message="Justificar Asistencia Empleado?" header="Confirmar" severity="warn">
        <p:commandButton value="Si" icon="pi pi-check" actionListener="#{incidenciaBean.actualizarRegistro()}"
            process="@this" oncomplete="PF('dialogRegistro').hide()" >
            <p:resetInput target="formIncidencias:tabViewI:pnlRegisto" />
        </p:commandButton>
        <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
            onclick="PF('dialogoJustificar').hide()" >
            <p:resetInput target="formIncidencias:tabViewI:pnlRegisto" />
        </p:commandButton>
    </p:confirmDialog>
    <script>
        PrimeFaces.locales['es'] = 
        {
            monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
            monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
            dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
            dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
            dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
            weekHeader: 'Semana',
            firstDay: 0,
            isRTL: false,
            showMonthAfterYear: false,
            yearSuffix: '',
            timeOnlyTitle: 'Sólo hora',
            timeText: 'Tiempo',
            hourText: 'Hora',
            minuteText: 'Minuto',
            secondText: 'Segundo',
            millisecondText: 'Milisegundo',
            ampm: false,
            month: 'Mes',
            week: 'Semana',
            day: 'Día',
            allDayText: 'Todo el día',
            today: 'Hoy',
            now: 'Ahora',
            clear: 'Limpiar',
            aria: {
               close: 'Cerrar',
               previous: 'Anterior',
               next: 'Siguiente'
           }
        };
    </script>
</ui:composition>
