<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:toolbar styleClass="mb-4">
        <p:toolbarGroup align="right">
            <p:commandButton value="Descargar" icon="pi pi-download" styleClass="ui-button-secondary" ajax="false">
                <p:dataExporter type="pdf" target="dtPrendasSolicitados" fileName="prendas"/>
            </p:commandButton>
        </p:toolbarGroup>
    </p:toolbar>

    <p:dataTable id="dtPrendasSolicitados" widgetVar="dtPrendasSolicitados" lazy="false" value="#{incidenciaBean.listaPrendas}" 
                 var="prendas" rowKey="#{prendas.idIncidencia}" paginator="true" rows="5" paginatorPosition="bottom" >
        <p:column headerText="Nombre" width="8rem">
            <p:outputLabel value="#{prendas.empleado.nombre} #{prendas.empleado.primerAp} #{prendas.empleado.segundoAp}"/>
        </p:column>
        <p:column headerText="Prendas" width="5rem">
            <p:outputLabel value="#{(prendas.tipoIncidencia.clave.matches('PR')) ? prendas.solPrenda.prenda.descripcion :''}"/>
        </p:column>
        <p:column headerText="Imagen" width="5rem">
            <h:graphicImage url="/imagen/uniforme?name=#{prendas.solPrenda.prenda.descripcion}.jpg" width="57" />
        </p:column>
        <p:column headerText="Cantidad" width="5rem">
            <p:outputLabel value="#{(prendas.tipoIncidencia.clave.matches('PR')) ? prendas.solPrenda.cantidad : ''}"/>
        </p:column>
        <p:column headerText="Talla" width="5rem">
            <p:outputLabel value="#{(prendas.tipoIncidencia.clave.matches('PR')) ? prendas.solPrenda.talla.descripcion : ''}"/>
        </p:column>
        <p:column headerText="Captura" width="5rem">
            <p:outputLabel value="#{(prendas.tipoIncidencia.clave.matches('PR')) ? prendas.fechaCap : ''}">
                <f:convertDateTime type="date" pattern="dd/MM/yyyy" />
            </p:outputLabel>
        </p:column>
        <p:column headerText="Estatus" width="5rem">
            <p:outputLabel class="customer-badge status-#{incidenciaBean.status.getStatusClass(prendas.estatusIncidencia.clave)}"
                           value="#{prendas.estatusIncidencia.descripcion}" style="display: block; width: 7rem"/>
        </p:column>
        <p:column exportable="false" style="text-align: center" width="5rem">
            <p:commandButton icon="pi pi-bars" class="ui-button-success rounded-button m-1" styleClass="edit-button" process="@this" 
                             action="#{incidenciaBean.visualizaDialog(prendas)}" update="formIncidencias:tabViewI:dialogPrendas">
                <f:setPropertyActionListener value="#{prendas}" target="#{incidenciaBean.incidenciaSelected}" for="@previous"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>

    <p:dialog id="dialogPrendas" widgetVar="dialogPrendas" header="Detalle solicitud uniforme" showEffect="fade" responsive="true" modal="true" 
              styleClass="ferbo-dialog-complemento-articulo" dynamic="true" cache="false" >
        <p:outputPanel id="pnlPrendas" rendered="#{incidenciaBean.incidenciaSelected ne null}">
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel id="soPrenda" value="#{incidenciaBean.incidenciaSelected.solPrenda.prenda.descripcion}" style="display:block ;font-size: 1.6rem;font-weight: 700;"/>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <h:graphicImage id="imgPrenda" url="/imagen/uniforme?name=#{incidenciaBean.incidenciaSelected.solPrenda.prenda.descripcion}.jpg" width="113" rendered="#{incidenciaBean.incidenciaSelected.solPrenda.prenda.descripcion ne null}" styleClass="product-image"/>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel id="soCantidadTalla" value="Cantidad: #{incidenciaBean.incidenciaSelected.solPrenda.cantidad} #{incidenciaBean.incidenciaSelected.solPrenda.talla.descripcion}" style="display:block ;font-size: 1.6rem;font-weight: 700;"/>
                </div>
            </div>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Aprobar" icon="pi pi-check" class="ui-button-success" process="pnlPrendas @this"
                             actionListener="#{incidenciaBean.guardarEstatusPrenda(true)}" 
                             disabled="#{incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 2 or incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 3 or incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 4}"/>
            <p:commandButton value="Rechazar" icon="pi pi-times" class="ui-button-danger" process="pnlPrendas @this"
                             disabled="#{incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 2 or incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 3 or incidenciaBean.incidenciaSelected.estatusIncidencia.idEstatus eq 4}"
                             oncomplete="PF('dialogRechazarPrendas').show()"/>
        </f:facet>
    </p:dialog>

    <p:dialog widgetVar="dialogRechazarPrendas" header="Detalle rechazo" showEffect="fade" responsive="true" modal="true" 
              styleClass="ferbo-dialog" dynamic="true" cache="false" >
        <p:outputPanel id="pnlDetalleRechazoPrendas" styleClass="ui-fluid pb-3">
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="txtRechazoPrendas" value="Descripción de rechazo"/>
                    <p:inputTextarea id="txtRechazoPrendas" value="#{incidenciaBean.incidenciaSelected.solPrenda.descripcionRechazo}"/>
                </div>
            </div>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Aceptar" icon="pi pi-check" class="ui-button-success" process="pnlDetalleRechazoPrendas @this"
                             actionListener="#{incidenciaBean.guardarEstatusPrenda(false)}" oncomplete="PF('dialogRechazarPrendas').hide()" update="formIncidencias:tabViewI:dtPrendasSolicitados"/>
            <p:commandButton value="Cancelar" icon="pi pi-times" class="ui-button-secondary" process="@this" 
                             oncomplete="PF('dialogRechazarPrendas').hide()"/>
        </f:facet>
    </p:dialog>
</ui:composition>
