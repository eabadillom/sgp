<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <div class="ui-fluid formgrid grid" >
        <div class="field col-12 md:col-2">
        	<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            <p:selectBooleanButton id="idVacaciones" widgetVar="idVacaciones" value="#{incidenciasSolicitudesBean.incidenciaVacaciones}" onIcon="pi pi-check" onLabel="Vacaciones" offIcon="pi pi-times" offLabel="Vacaciones">
                <p:ajax event="change" update="dtIncidencias" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
            </p:selectBooleanButton>
        </div>
        <div class="field col-12 md:col-2">
        	<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            <p:selectBooleanButton id="idPermiso" widgetVar="idPermiso" value="#{incidenciasSolicitudesBean.incidenciaPermiso}" onIcon="pi pi-check" onLabel="Permisos" offIcon="pi pi-times" offLabel="Permisos" >
                <p:ajax event="change" update="dtIncidencias" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
            </p:selectBooleanButton>
        </div>
        <div class="field col-12 md:col-2">
        	<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            <p:selectBooleanButton id="idEstatusAceptado" value="#{incidenciasSolicitudesBean.estatusAceptado}" onIcon="pi pi-check" onLabel="Aprobadas" offIcon="pi pi-times" offLabel="Aprobadas" >
                <p:ajax event="change" update="dtIncidencias" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
            </p:selectBooleanButton>
        </div>
        <div class="field col-12 md:col-2" >
        	<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            <p:selectBooleanButton id="idEstatusEnviado" value="#{incidenciasSolicitudesBean.estatusEnviado}" onIcon="pi pi-check" onLabel="Pendientes" offIcon="pi pi-times" offLabel="Pendientes" >
                <p:ajax event="change" update="dtIncidencias" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
            </p:selectBooleanButton>
        </div>
    </div>

    <p:dataTable id="dtIncidencias" widgetVar="dtIncidencias" value="#{incidenciasSolicitudesBean.consultarTipoPermisos()}" selection="#{incidenciasSolicitudesBean.listaPermisosFiltrada}"
                 var="incidencia" rowKey="#{incidencia.idIncidencia}" paginator="true" rows="8" paginatorPosition="bottom" reflow="true">
        <f:facet name="header">
            <div class="flex justify-content-start">
                <p:inputText id="filtarNombre" value="#{incidenciasSolicitudesBean.filtroEmpleado}" onkeyup="PF('dtIncidencias').filter()" style="width:300px" 
                             placeholder="Buscar empleado por nombre o apellidos">
                    <p:ajax update="dtIncidencias" process="@this"/>
                </p:inputText>
            </div>
        </f:facet>
        <p:column headerText="Nombre">
            <p:outputLabel value="#{incidencia.empleado.nombre} #{incidencia.empleado.primerAp} #{incidencia.empleado.segundoAp}"/>
        </p:column>
        <p:column headerText="Tipo" width="7rem" style="text-align: center;">
            <p:outputLabel value="#{(incidencia.tipoIncidencia.idTipo eq 1 || incidencia.tipoIncidencia.idTipo eq 2) ? incidencia.solPermiso.tipoSolicitud.descripcion :'' }"/>
        </p:column>
        <p:column headerText="Inicio" width="5rem" style="text-align: center;">
            <p:outputLabel value="#{(incidencia.tipoIncidencia.idTipo eq 1 || incidencia.tipoIncidencia.idTipo eq 2) ? incidencia.solPermiso.fechaInicio :''}">
                <f:convertDateTime type="date" pattern="dd/MM/yyyy" />
            </p:outputLabel>
        </p:column>
        <p:column headerText="Fin" width="5rem" style="text-align: center;">
            <p:outputLabel value="#{(incidencia.tipoIncidencia.idTipo eq 1 || incidencia.tipoIncidencia.idTipo eq 2) ? incidencia.solPermiso.fechaFin :''}">
                <f:convertDateTime type="date" pattern="dd/MM/yyyy" />
            </p:outputLabel>
        </p:column>
        <p:column headerText="Status" width="9rem" style="text-align: center;">
            <p:outputLabel class="customer-badge status-#{incidenciasSolicitudesBean.status.getStatusClass(incidencia.estatusIncidencia.clave)}"
                           value="#{incidencia.estatusIncidencia.descripcion}"/>
        </p:column>
        <p:column style="text-align: center" width="2rem">
            <p:commandButton icon="pi pi-bars" process="@this" styleClass="edit-button"
                             action="#{incidenciasSolicitudesBean.visualizaDialog(incidencia)}" update="formIncidencias:tabViewI:dialogPermisos"
                             onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();">
            </p:commandButton>
        </p:column>

    </p:dataTable>

    <p:dialog id="dialogPermisos" widgetVar="dialogPermisos" header="Información del permiso" showEffect="fade" responsive="true" modal="true" 
              styleClass="ferbo-dialog" dynamic="true" cache="false" >
        <p:outputPanel id="pnlDetalleSolicitudPermiso" rendered="#{incidenciasSolicitudesBean.incidenciaSelected ne null}" styleClass="ui-fluid pb-3">

            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="soTipoPermiso" value="Tipo"/>
                    <p:selectOneMenu id="soTipoPermiso" autoWidth="false" value="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud}" 
                                     disabled="true">
                        <f:selectItems value="#{incidenciasSolicitudesBean.lstTipoSol}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV.idTipoSolicitud}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="formgrid grid" >
                <div class="field col" >
                    <p:outputLabel value="Dias de #{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.descripcion} Solicitados"/>
                    <p:inputText value="#{incidenciasSolicitudesBean.diasVacacionesSolicitados}" disabled="true"/>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="soEstatusView" value="Estatus"/>
                    <p:selectOneMenu id="soEstatusView" autoWidth="false" value="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.estatus.id}" 
                                     disabled="true">
                        <f:selectItem itemLabel="ENVIADA" itemValue="1"/>
                        <f:selectItem itemLabel="APROBADA" itemValue="2"/>
                        <f:selectItem itemLabel="RECHAZADA" itemValue="3"/>
                        <f:selectItem itemLabel="CANCELADA" itemValue="4"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="formgrid grid" >
                <div class="field col" style="width: 5rem" >
                    <p:outputLabel value="Inicio de Vacaciones"/>
                    <p:inputText value="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.fechaInicio}" disabled="true" >
                        <f:convertDateTime type="date" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </p:inputText>
                </div>
                <div class="field col" style="width: 5rem" >
                    <p:outputLabel value="Termino de Vacaciones" />
                    <p:inputText value="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.fechaFin}" disabled="true">
                        <f:convertDateTime type="date" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </p:inputText>
                </div>
            </div>
            <div class="formgrid grid">
                <p:panel visible="#{incidenciasSolicitudesBean.incidenciaSelected.empleado.empleadoConfiguracion.goceSueldo and incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud eq 1}">
                    <div class="field col" style="width: 15rem" >
                        <p:outputLabel value="Con goce de sueldo: "/>
                        <p:spinner id="conGoceSueldo" value="#{incidenciasSolicitudesBean.goceSueldo}" min="0" max="100" suffix="%"  stepFactor="0.1"/>
                    </div>
                </p:panel>
            </div>
            <p:datePicker id="lazyEvent" rendered="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud ne null 
                                                       and (incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud eq 2 
                                                       or incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud eq 4)}" 
                          styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" locale="es" disabled="false" 
                          showIcon="true" readonlyInput="true" value="#{incidenciasSolicitudesBean.lstRangoRegistro}" showMinMaxRange="true" 
                          mindate="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.fechaInicio}" maxdate="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.fechaFin}"
                          inline="true" selectionMode="multiple" disabledDays="#{incidenciasSolicitudesBean.invalidDays}"
                          disabledDates="#{incidenciasSolicitudesBean.diasDeAsueto}"/>
            <p:datePicker id="dpSimpleView" rendered="#{incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud ne null 
                                                        and (incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud eq 1 
                                                        or incidenciasSolicitudesBean.incidenciaSelected.solPermiso.tipoSolicitud.idTipoSolicitud eq 3)}" 
                          styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" locale="es" disabled="false"
                          pattern="dd-MM-yyyy" showIcon="true" readonlyInput="true" value="#{incidenciasSolicitudesBean.fechaSeleccionada}"
                          showMinMaxRange="true" mindate="#{incidenciasSolicitudesBean.fechaSeleccionada}" maxdate="#{incidenciasSolicitudesBean.fechaSeleccionada}"
                          inline="true" disabledDays="#{incidenciasSolicitudesBean.invalidDays}"
                          disabledDates="#{incidenciasSolicitudesBean.diasDeAsueto}"/>

        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Aprobar" icon="pi pi-check" process="pnlDetalleSolicitudPermiso @this"
                             actionListener="#{incidenciasSolicitudesBean.aprobarIncidencia()}"
                             rendered="#{incidenciasSolicitudesBean.permiteAprobar()}"/>
            <p:commandButton value="Rechazar" icon="pi pi-times" class="ui-button-outlined ui-button-danger" process="pnlDetalleSolicitudPermiso @this"
                             rendered="#{incidenciasSolicitudesBean.permiteRechazar()}"
                             oncomplete="PF('dialogPermisos').hide(); PF('dialogRechazar').show()"/>
            <p:commandButton value="Cancelar" icon="pi pi-trash" class="ui-button-outlined ui-button-danger" process="pnlDetalleSolicitudPermiso @this" 
                             rendered="#{incidenciasSolicitudesBean.permiteCancelar()}"
                             oncomplete="PF('dialogPermisos').hide(); PF('dialogoCancelar').show()"/>
            <p:commandButton value="Cerrar" icon="pi pi-times" class="ui-button-secondary" onclick="PF('').hide();">
            	<p:resetInput target="formIncidencias:tabViewI:pnlDetalleSolicitudPermiso" />
            </p:commandButton> 
        </f:facet>
    </p:dialog>
    <p:dialog widgetVar="dialogRechazar" header="Detalle rechazo" showEffect="fade" responsive="true" modal="true" width="100%" height="100%" position="center top"
              styleClass="ferbo-dialog" dynamic="true" cache="false" >
        <p:outputPanel id="pnlDetalleRechazo" styleClass="ui-fluid pb-3">
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="txtRechazo" value="Descripción:"/>
                    <p:keyboard id="txtRechazo" value="#{incidenciasSolicitudesBean.descripcionRechazo}" layout="custom"
                        layoutTemplate="1234567890,qwertyuiop,asdfghjkl,zxcvbnm,shift-back-spacebar-clear-close" style="height: 8rem" styleClass="aqua" />
                </div>
            </div>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Aceptar" icon="pi pi-check" class="ui-button-success" process="pnlDetalleRechazo @this"
                             actionListener="#{incidenciasSolicitudesBean.rechazarIncidencia()}" oncomplete="PF('dialogRechazar').hide()" />
        </f:facet>
    </p:dialog>
    <p:confirmDialog widgetVar="dialogoCancelar" showEffect="fade" width="300" 
                     message="¿Está seguro que desea cancelar el permiso?" header="Confirmar" severity="warn">
        <p:commandButton value="Si" icon="pi pi-check" actionListener="#{incidenciasSolicitudesBean.cancelarIncidencia()}"
            process="@this" oncomplete="PF('dialogPermisos').hide()" >
            <p:resetInput target="formIncidencias:tabViewI:pnlDetalleSolicitudPermiso" />
        </p:commandButton>
        <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
            onclick="PF('dialogoCancelar').hide()" >
            <p:resetInput target="formIncidencias:tabViewI:pnlDetalleSolicitudPermiso" />
        </p:commandButton>
    </p:confirmDialog>
    <style>
        .ferbo-datePicker .ui-datepicker-calendar td a.ui-state-active{
            background: #77ff00 !important;
        }
        #keypad-div.aqua {
            background: #6699CC;
            border: 1px solid #CCCCFF;
            -moz-border-radius: 20px;
            -webkit-border-radius: 20px;
        }
        .aqua .keypad-key {
            width: 40px;
            border: 1px solid #CCCCFF;
            -moz-border-radius: 20px;
            -webkit-border-radius: 20px;
            color: #FFFFFF;
            background: #99CCFF;
        }
        .aqua .keypad-key-down {
            background: #8c8;
        }
        .aqua .keypad-clear {
            letter-spacing: -1px;
        }
        .aqua .keypad-space {
            width: 40px;
        }
    </style>
</ui:composition>
