<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">Cuotas del IMSS</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <p:growl id="messages" showDetail="true" life="3000"/>
            <p:dialog modal="true" widgetVar="statusInfoDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
				<div align="center">
					<i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
				</div>
			</p:dialog>
            <p:toolbar>
                <p:toolbarGroup align="left">
                    <p:commandButton value="Agregar" icon="pi pi-plus" actionListener="#{cuotasImssBean.openNew}" update="form:manage-product-content" oncomplete="PF('manageProductDialog').show()" process="@this">
                    </p:commandButton>
                </p:toolbarGroup>
                <p:toolbarGroup align="right">
                	<p:selectOneMenu value="#{cuotasImssBean.anio}" >
                		<f:selectItem itemLabel="--SELECCIONE UN AÑO---" noSelectionOption="true" />
                		<f:selectItems value="#{cuotasImssBean.anios}" var="anio" itemLabel="#{anio}" itemValue="#{anio}"/>
                		<p:ajax process="@this" event="change" listener="#{cuotasImssBean.filtrar()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" update="dt-imss"/>
                	</p:selectOneMenu>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="dt-imss" widgetVar="dtImss" var="cuotaImss" value="#{cuotasImssBean.cuotasIMSS}" reflow="true" styleClass="products-table" paginator="true" rows="10" paginatorPosition="bottom">
                <p:column headerText="Clave" style="text-align: center;" width="4rem">
                    <h:outputText value="#{cuotaImss.clave }" />
                </p:column>
                <p:column headerText="Descripción" width="auto">
                    <h:outputText value="#{cuotaImss.descripcion}" />
                </p:column>
                <p:column headerText="Base Salarial" style="text-align: center;" width="6rem">
                    <h:outputText value="#{cuotaImss.baseSalarial}" />
                </p:column>
                <p:column headerText="Cuota" width="6rem">
                	<h:outputText value="#{cuotaImss.cuota}" />
                </p:column>
                <p:column headerText="Vigencia Inicio" style="text-align: center;" width="6rem">
                    <h:outputText value="#{cuotaImss.vigenciaInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Vigencia Fin" style="text-align: center;" width="6rem">
                    <h:outputText value="#{cuotaImss.vigenciaInicio}">
                        <f:convertDateTime pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </h:outputText>
                </p:column>
                <p:column exportable="false" ariaHeaderText="Actions" width="2rem">
                    <p:commandButton icon="pi pi-bars" update="form:manage-product-content" oncomplete="PF('manageProductDialog').show()" styleClass="edit-button " process="@this">
                        <f:setPropertyActionListener value="#{cuotaImss}" target="#{cuotasImssBean.cuotaIMSSNueva}" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
			<p:dialog header="Detalles de la Cuota" showEffect="fade" modal="true" widgetVar="manageProductDialog" responsive="true" draggable="true" resizable="false" dynamic="true" style="margin: auto">
					<p:outputPanel id="manage-product-content" class="ui-fluid" rendered="#{cuotasImssBean.cuotaIMSSNueva ne null}">
						<div class="field">
							<p:outputLabel for="@next">Clave</p:outputLabel>
							<p:inputText id="clave" value="#{cuotasImssBean.cuotaIMSSNueva.clave}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Descripción</p:outputLabel>
							<p:inputText id="descripcion" value="#{cuotasImssBean.cuotaIMSSNueva.descripcion}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Base Salarial</p:outputLabel>
							<p:inputText id="baseSalarial" value="#{cuotasImssBean.cuotaIMSSNueva.baseSalarial}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Base Minimo</p:outputLabel>
							<p:inputText id="baseMinimo" value="#{cuotasImssBean.cuotaIMSSNueva.baseMinimo}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Base Maximo</p:outputLabel>
							<p:inputText id="baseMaximo" value="#{cuotasImssBean.cuotaIMSSNueva.baseMaximo}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Cuota</p:outputLabel>
							<p:inputText id="cuota" value="#{cuotasImssBean.cuotaIMSSNueva.cuota}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
							<p:outputLabel for="@next">Tipo Cuota</p:outputLabel>
							<p:inputText id="tipoCuota" value="#{cuotasImssBean.cuotaIMSSNueva.tipoCuota}" required="true" >
							    <p:ajax process="@this"/>
							</p:inputText>
						</div>
						<div class="field">
						    <p:outputLabel for="@next">Vigencia Inicio</p:outputLabel>
						    <p:datePicker id="vigenciaInicio" value="#{cuotasImssBean.cuotaIMSSNueva.vigenciaInicio}" required="true" showIcon="true" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
						        <p:ajax process="@this"/>
						    </p:datePicker>
						</div>
						<div class="field">
						    <p:outputLabel for="@next">Vigencia Fin</p:outputLabel>
						    <p:datePicker id="vigenciaFin" value="#{cuotasImssBean.cuotaIMSSNueva.vigenciaFin}" required="true" showIcon="true" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
						        <p:ajax process="@this"/>
						    </p:datePicker>
						</div>
					</p:outputPanel>
			    <f:facet name="footer">
			        <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{cuotasImssBean.crearCuotaIMSSNueva}" update="manage-product-content form:dt-imss" process="manage-product-content @this">
			        </p:commandButton>
			        <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageProductDialog').hide()"
			            class="ui-button-secondary" type="button" />
			    </f:facet>
			</p:dialog>
        </h:form>
    </ui:define>

</ui:composition>
