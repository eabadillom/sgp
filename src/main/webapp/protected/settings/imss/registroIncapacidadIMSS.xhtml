<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">Incapacidades</ui:define>
    <ui:define name="content">
        <h:form id="form">
        	<ui:include src="/protected/common/status-info.xhtml" />
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="30rem">
				<p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes ui-button-primary" icon="pi pi-check"/>
				<p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-outlined ui-button-secondary" icon="pi pi-times" />
			</p:confirmDialog>
            <div class="ui-fluid formgrid grid align-items-left">
            	<div class="field col-12 md:col-2">
            		<p:outputLabel for="@next" value="Periodo Inicio" />
					<p:datePicker value="#{registroIncBean.periodoInicio}" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy"
							styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel">
						<p:ajax listener="#{registroIncBean.actualizarListaRegistroIncapacidades()}" update="dtRegistroIncapacidad" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
					</p:datePicker>
            	</div>
            	<div class="field col-12 md:col-2">
					<p:outputLabel for="@next" value="Periodo Fin" />
					<p:datePicker value="#{registroIncBean.periodoFin}" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy"
							styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel">
						<p:ajax listener="#{registroIncBean.actualizarListaRegistroIncapacidades()}" update="form:dtRegistroIncapacidad" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
					</p:datePicker>
            	</div>
                <p:divider layout="vertical"></p:divider>
            	<div class="field col-12 md:col-2">
            		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
					<p:selectBooleanButton id="idEstatusAprobado" value="#{registroIncBean.estatusAprobado}" onIcon="pi pi-check" onLabel="Aceptada" offIcon="pi pi-times" offLabel="Aceptada" style="width: 100%;">
						<p:ajax event="change" update="form:dtRegistroIncapacidad" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
					</p:selectBooleanButton>
            	</div>
            	<div class="field col-12 md:col-2">
            		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
					<p:selectBooleanButton id="idEstatusCancelado" value="#{registroIncBean.estatusCancelado}" onIcon="pi pi-check" onLabel="Cancelada" offIcon="pi pi-times" offLabel="Cancelada" style="width: 100%;">
					    <p:ajax event="change" update="dtRegistroIncapacidad" process="@this" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
					</p:selectBooleanButton>
            	</div>
                <p:divider layout="vertical"></p:divider>
            	<div class="field col-12 md:col-2">
            		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
					<p:commandButton value="Registrar" icon="pi pi-plus" oncomplete="PF('dialogoRegistoIncapacidad').show();" update="pnlRegistoIncapacidad" 
						actionListener="#{registroIncBean.incializarSolicitud()}" process="@this" style="margin-right: .5rem" >
						<p:resetInput target="form:pnlRegistoIncapacidad" />
					</p:commandButton>
            	</div>
                <div class="field col-12 md:col-2">
            		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
            	</div>
            </div>
            
            <p:dataTable id="dtRegistroIncapacidad" widgetVar="dtRegistroIncapacidad" var="incapacidad" reflow="true"
                         value="#{registroIncBean.consultarIncapacidades()}" selection="#{registroIncBean.listaRegistroFiltrada}" 
                         paginator="true" rows="10" paginatorPosition="bottom" >
                <p:column headerText="Empleado">
                    <h:outputText value="#{incapacidad.empleado.nombre} #{incapacidad.empleado.primerAp} #{incapacidad.empleado.segundoAp}" />
                </p:column>
                <p:column headerText="Incapacidad" style="text-align: center;" width="15rem">
                    <h:outputText value="#{incapacidad.tipoIncapacidad.descripcion}" />
                </p:column>
                <p:column headerText="Periodo" style="text-align: center;" width="8rem" >
                    <h:outputText value="#{incapacidad.fechaInicio}" >
                        <f:convertDateTime type="date" pattern="dd MMM yyyy" timeZone="GMT-6" locale="es_MX"/>
                    </h:outputText>
                    <p:outputLabel value=" al " />
                    <h:outputText value="#{incapacidad.fechaFin}" >
                        <f:convertDateTime type="date" pattern="dd MMM yyyy" timeZone="GMT-6" locale="es_MX"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Estatus" style="text-align: center;" width="7rem">
                    <p:outputLabel class="customer-badge status-#{registroIncBean.status.getEstatusIncapacidad(incapacidad.estatusSolicitud.clave)}"
                        value="#{incapacidad.estatusSolicitud.descripcion}" style="width: 12rem"/>
                </p:column>
                <p:column width="2rem" style="text-align: center;">
                    <p:commandButton icon="pi pi-bars" update="form:pnlRegistoIncapacidad"  oncomplete="PF('dialogoRegistoIncapacidad').show()" process="@this" actionListener="#{registroIncBean.editarSolicitud(incapacidad)}" >
                        <f:setPropertyActionListener value="#{incapacidad}" target="#{registroIncBean.incapacidad}" />
                    </p:commandButton>
                </p:column>
                <p:column width="2rem" style="text-align: center;">
                    <p:commandButton icon="pi pi-times" update="form:pnlRegistoIncapacidad" oncomplete="PF('dialogoRegistoIncapacidad').show()" styleClass="ui-button-danger" process="@this"
                        actionListener="#{registroIncBean.cancelarSolicitud(incapacidad)}" >
                    </p:commandButton>
                </p:column>
                
            </p:dataTable>
            <p:dialog header="Incapacidad" id="dialogoRegistoIncapacidad" showEffect="fade" modal="true" 
                      widgetVar="dialogoRegistoIncapacidad" responsive="true" draggable="true" resizable="false" dynamic="true" style="margin: auto">
                <p:outputPanel id="pnlRegistoIncapacidad" styleClass="ui-fluid">
                    <div class="formgrid grid">
                        <div class="field col">
                            <p:outputLabel for="@next" value="Empleado"/>
                            <p:selectOneMenu id="empleado" autoWidth="false" converter="entityConverter" value="#{registroIncBean.incapacidad.empleado}"
                                             disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave.matches('C') eq true}" 
                                             filter="true" filterMatchMode="contains" styleClass="custom-style">
                                <f:selectItem itemLabel="--Seleccione--" itemValue="#{null}" />
                                <f:selectItems value="#{registroIncBean.listaEmpleados}" var="tipoV" itemLabel="#{tipoV.nombre} #{tipoV.primerAp} #{tipoV.segundoAp}" itemValue="#{tipoV}"/>
                                <p:ajax event="change" update="pnlRegistoIncapacidad" process="@this" resetValues="true"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="field col">
                            <p:outputLabel for="@next" value="Tipo Incapacidad"/>
                            <p:selectOneMenu id="tipoIncapacidad" autoWidth="false" converter="entityConverter" value="#{registroIncBean.incapacidad.tipoIncapacidad}"
                                disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" itemValue="#{null}" />
                                <f:selectItems value="#{registroIncBean.listaIncapacidadesIMSS}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV}"/>
                                <p:ajax event="change" update="pnlRegistoIncapacidad" process="@this" resetValues="true"/>
                            </p:selectOneMenu>
                        </div>
                    </div>
                    <div class="formgrid grid">
                        <div class="field col">
                            <p:outputLabel for="@next" value="Control Incapacidad"/>
                            <p:selectOneMenu id="controlIncapacidad" autoWidth="false" converter="entityConverter" value="#{registroIncBean.incapacidad.controlIncapacidad}"
                                disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                                <f:selectItem itemLabel="--Seleccione--" itemValue="#{null}" />
                                <f:selectItems value="#{registroIncBean.listaControlIncapacidadIMSS}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV}"/>
                                <p:ajax event="change" update="pnlRegistoIncapacidad" process="@this" resetValues="true"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="field col">
                            <p:outputLabel for="@next" value="Riesgo Trabajo"/>
                            <p:selectOneMenu id="riesgoTrabajo" autoWidth="false" converter="entityConverter" value="#{registroIncBean.riesgoTrabajo}" 
                                             disabled="#{registroIncBean.incapacidad.tipoIncapacidad.incapacidadSAT.clave ne '01' 
                                            or registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' 
                                            or registroIncBean.controlIncapacidad.clave eq 'D'}" >
                                <f:selectItem itemLabel="--Seleccione--" itemValue="#{null}" />
                                <f:selectItems value="#{registroIncBean.listaRiesgoTrabajo}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV}"/>
                                <p:ajax event="change" update="pnlRegistoIncapacidad" process="@this" resetValues="true"/>
                            </p:selectOneMenu>
                        </div>
                        <div class="field col">
                            <p:outputLabel for="@next" value="Tipo de Riesgo de Trabajo"/>
                            <p:selectOneMenu id="tipoRiesgoTrabajo" autoWidth="false" converter="entityConverter" value="#{registroIncBean.tipoRiesgo}" 
                                             disabled="#{registroIncBean.incapacidad.tipoIncapacidad.incapacidadSAT.clave ne '01' 
                                            or registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' 
                                            or registroIncBean.controlIncapacidad.clave eq 'D'}" >
                                <f:selectItem itemLabel="--Seleccione--" itemValue="#{null}" />
                                <f:selectItems value="#{registroIncBean.listaTipoRiesgoIMSS}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV}"/>
                                <p:ajax event="change" update="pnlRegistoIncapacidad" process="@this" resetValues="true"/>
                            </p:selectOneMenu>
                        </div>
                    </div>
                    <div class="formgrid grid">
                        <div class="field col">
                            <p:outputLabel for="@next" value="Dias Autorizados"/>
                            <p:inputNumber id="diasAutorizados" value="#{registroIncBean.incapacidad.diasAutorizados}" 
                                disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}">
                                <p:ajax process="@this"/>
                            </p:inputNumber>
                        </div>
                        <div class="field col">
                            <p:outputLabel for="@next" value="Fecha Inicio" />
                            <p:datePicker id="fechaInicio" value="#{registroIncBean.incapacidad.fechaInicio}" showIcon="true" pattern="dd/MM/yyyy" locale="es_MX" 
                                          styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" timeZone="GMT-6" 
                                          disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                                <p:ajax process="@this"/>
                            </p:datePicker>
                        </div>
                        <h:panelGroup id="fechaFinPanel" rendered="#{registroIncBean.incapacidad.fechaFin ne null}">
                            <div class="field col">
                                <p:outputLabel for="@next" value="Fecha Fin" />
                                <p:datePicker id="fechaFin" value="#{registroIncBean.incapacidad.fechaFin}" showIcon="true" pattern="dd/MM/yyyy" locale="es_MX" 
                                              styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" timeZone="GMT-6" 
                                              disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                                    <p:ajax process="@this"/>
                                </p:datePicker>
                            </div>
                        </h:panelGroup>
                    </div>
                    <div class="formgrid grid">
                        <div class="field col">
                            <p:outputLabel for="@next" value="Folio"/>
                            <p:inputText id="folio" value="#{registroIncBean.incapacidad.folio}" maxlength="20"
                                disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                                <p:ajax process="@this"/>
                            </p:inputText>
                        </div>
                        <div class="field col">
                            <p:outputLabel for="@next" value="Descripcion"/>
                            <p:inputText id="descripcion" value="#{registroIncBean.incapacidad.descripcion}" 
                                disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}">
                                <p:ajax process="@this"/>
                            </p:inputText>
                        </div>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-save"
                                     actionListener="#{registroIncBean.guardar()}" process="pnlRegistoIncapacidad @this" 
                                     update="pnlRegistoIncapacidad dtRegistroIncapacidad" rendered="#{registroIncBean.estadoAccionBoton ne 3}"
                                     disabled="#{registroIncBean.incapacidad.estatusSolicitud.clave eq 'C' or registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'}" >
                        <p:resetInput target="form:pnlRegistoIncapacidad" />
                    </p:commandButton>
                    <p:commandButton value="Cancelar" icon="pi pi-trash" class="ui-button-danger"
					                 actionListener="#{registroIncBean.cancelar()}"
					                 process="pnlRegistoIncapacidad @this" update="pnlRegistoIncapacidad dtRegistroIncapacidad" 
					                 rendered="#{registroIncBean.incapacidad.idIncapacidad ne null}"
					                 disabled="#{registroIncBean.incapacidad.controlIncapacidad.clave eq 'D'
                                                            or registroIncBean.incapacidad.estatusSolicitud.clave eq 'C'}">
						<p:confirm header="Cancelar incapacidad" message="¿Está seguro que quiere cancelar la incapacidad?" icon="pi pi-exclamation-triangle" />
						<p:resetInput target="form:pnlRegistoIncapacidad" />
                    </p:commandButton>
                    <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogoRegistoIncapacidad').hide()" 
                                     class="ui-button-secondary" actionListener="#{registroIncBean.incializarSolicitud()}" >
                        <p:resetInput target="form:pnlRegistoIncapacidad" />
                    </p:commandButton>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
