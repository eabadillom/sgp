<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">UMA</ui:define>
    <ui:define name="content">
        <h:form id="form">
            <p:growl id="messages" showDetail="true" />
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Agregar" icon="pi pi-plus" actionListener="#{umaBean.incializarUMA()}"
                        update="pnlContentUMA" oncomplete="PF('manageUMADialog').show()" style="margin-right: .5rem" >
                    </p:commandButton>
                </p:toolbarGroup>
            </p:toolbar>
            <p:dataTable id="dtUma" widgetVar="dtUMA" var="uma" value="#{umaBean.catUMAS}" reflow="true" styleClass="products-table"
                selection="#{umaBean.catUMASeleccionada}" rowKey="#{uma.anio}" paginator="true" rows="10" paginatorPosition="bottom"
                lazy="true">
                <p:column headerText="Año" style="text-align: center;" width="4rem">
                    <h:outputText value="#{uma.anio}" />
                </p:column>
                <p:column headerText="Valor Diario" style="text-align: center;" width="4rem">
                    <h:outputText value="#{uma.importeDiario}" >
                        <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" locale="es_MX"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Valor Mensual" style="text-align: center;" width="4rem">
                    <h:outputText value="#{uma.importeMensual}" >
                        <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" locale="es_MX"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Valor Anual" style="text-align: center;" width="4rem">
                    <h:outputText value="#{uma.importeAnual}" >
                        <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" locale="es_MX"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Fecha de Publicacion" style="text-align: center;" width="5rem">
                    <h:outputText value="#{uma.fechaPublicacion}" >
                        <p:calendar pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Fecha de Aplicacion" style="text-align: center;" width="5rem">
                    <h:outputText value="#{uma.fechaAplicacion}" >
                        <p:calendar pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Fecha de vigencia" style="text-align: center;" width="5rem">
                	<h:outputText value="#{uma.fechaVigencia}" >
                        <p:calendar pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </h:outputText>
                </p:column>
                <p:column exportable="false" ariaHeaderText="Actions" width="2rem">
                    <p:commandButton icon="pi pi-bars" oncomplete="PF('manageUMADialog').show()" styleClass="edit-button " 
                                     process="@this" update="form:pnlContentUMA" actionListener="#{umaBean.editarUMA(uma)}">
                        <f:setPropertyActionListener value="#{uma}" target="#{umaBean.umaSelected}" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:dialog id="manageUMADialog" header="#{umaBean.accionBoton} UMA" showEffect="fade" modal="true" widgetVar="manageUMADialog"
                responsive="true" draggable="true" resizable="false" dynamic="true" style="margin: auto">
                <p:outputPanel id="pnlContentUMA" class="ui-fluid" >
                    <div class="field col">
                        <p:outputLabel for="@next" value="Año" />
                        <p:inputText id="clave" value="#{umaBean.umaSelected.anio}" >
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </div>
                    <div class="field col">
                        <p:outputLabel for="@next" value="Valor Diario" />
                        <p:inputText id="vDiario" value="#{umaBean.umaSelected.importeDiario}" >
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </div>
                    <div class="field col">
                        <p:outputLabel for="@next" >Fecha Publicación</p:outputLabel>
                        <p:calendar id="fPublicacion" value="#{umaBean.fechaPublicacion}" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6" >
                            <p:ajax process="@this"/>
                        </p:calendar>
                    </div>
                    <div class="field col">
                        <p:outputLabel for="@next" >Fecha Aplicación</p:outputLabel>
                        <p:calendar id="fVigencia" value="#{umaBean.fechaAplicacion}" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
                            <p:ajax process="@this"/>
                        </p:calendar>
                    </div>
                    <div class="field col">
                        <p:outputLabel for="@next" >Fecha Vigencia</p:outputLabel>
                        <p:calendar id="fAplicacion" value="#{umaBean.fechaVigencia}" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6">
                            <p:ajax process="@this"/>
                        </p:calendar>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="#{umaBean.accionBoton}" icon="#{umaBean.iconoBoton}" actionListener="#{umaBean.metodoBoton()}" 
                                     process="@this form:pnlContentUMA" update="dtUma" />
                    <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('manageUMADialog').hide()"
                                        class="ui-button-secondary" type="button" >
                        <p:resetInput target="form:pnlContentUMA" />
                    </p:commandButton>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
