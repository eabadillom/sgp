<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xxmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/template.xhtml">

    <ui:define name="title">Prendas</ui:define>
    <ui:define name="content">
        <f:event type="preRenderView" listener="#{prendasBean.listar(false)}"/>

        <h:form id="frm" enctype="multipart/form-data"> 
            <p:growl id="message" showDetails="true" life="4000"/>
            <p:dialog modal="true" widgetVar="statusDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
                <div align="center">
                    <i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
                </div>
            </p:dialog>
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Agregar" update="" icon="pi pi-plus" 
                                     actionListener="#{prendasBean.nuevaPrenda}" 
                                     oncomplete="PF('dlgPrenda').show();" styleClass="edit-button" 
                                     process="@this"/>
                </p:toolbarGroup>
            </p:toolbar>

            <div style="padding-top: 1rem">
                <p:dataTable id="dtPrendas" value="#{prendasBean.prendas}" var="prenda" paginator="true" rows="6">
                    <p:column headerText="Prenda" sortBy="#{prenda.descripcion}" style="text-align: center;">
                        <p:outputLabel value="#{prenda.descripcion}" />
                    </p:column>

                    <p:column headerText="" width="18%" style="text-align: center;" >
                        <h:graphicImage name="images/prendas/#{prenda.descripcion}.jpg" library="recursos" width="57" />
                    </p:column>

                    <p:column headerText="Cantidad Maxima por pedido" sortBy="#{prenda.cantidadMax}" style="text-align: center;">
                        <p:outputLabel value="#{prenda.cantidadMax}"/>
                    </p:column>

                    <p:column headerText="Precio" sortBy="#{prenda.precio}" style="text-align: center;">
                        <p:outputLabel value="$ #{prenda.precio}"/>
                    </p:column>

                    <p:column headerText="Disponibilidad" sortBy="#{prendasBean.disponibilidad(prenda)}" style="text-align: center;">
                        <p:outputLabel value="#{prendasBean.disponibilidad(prenda)}"/>
                    </p:column>

                    <p:column headerText="" style="text-align: center;">
                        <p:commandButton icon="pi pi-bars" update="frm:dlgPrenda"
                                         actionListener="#{prendasBean.pasarPrenda(prenda)}"
                                         oncomplete="PF('dlgPrenda').show();" styleClass="edit-button"
                                         process="@this" style="margin: 0.3rem;" />
                        <p:commandButton icon="pi pi-trash"
                                         actionListener="#{prendasBean.pasarPrenda(prenda)}"
                                         oncomplete="PF('borrarPrenda').show();"
                                         styleClass="ui-button-raised ui-button-danger"
                                         process="@this" style="margin: 0.3rem;" />

                    </p:column>

                </p:dataTable>
            </div>

            <p:dialog header="#{prendasBean.getAccion()} Prenda" showEffect="fade" modal="true" widgetVar="dlgPrenda" id="dlgPrenda" 
                      responsive="true" draggable="true" resizable="false" dynamic="true" style="margin: auto">
                <p:outputPanel id="datos" class="ui-fluid">

                    <div class="p-field">
                        <p:outputLabel for="@next" value="Prenda: "/>
                        <p:inputText value="#{prendasBean.prenda.descripcion}" required="true">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Cantidad maxima por solicitud: "/>
                        <p:inputText value="#{prendasBean.prenda.cantidadMax}" required="true">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </div>
                    <div class="p-field">
                        <p:outputLabel for="@next" value="Precio: "/>
                        <p:inputText value="#{prendasBean.prenda.precio}">
                            <p:ajax process="@this"/>
                        </p:inputText>
                    </div>

                    <div class="p-field">
                        <p:outputLabel for="@next" value="Disponibilidad: "/>
                        <p:selectOneRadio value="#{prendasBean.prenda.activo}">
                            <f:selectItem itemValue="1" itemLabel="Existencia" />
                            <f:selectItem itemValue="0" itemLabel="Sin Existencia" />
                            <p:ajax process="@this"/>
                        </p:selectOneRadio>
                    </div>

                    <p:fileUpload value="#{prendasBean.imagen}"
                                  accept=".jpeg,.jpg" 
                                  allowTypes="/(\.|\/)(jpeg|jpg)$/"
                                  mode="simple" 
                                  skinSimple="true">
                    </p:fileUpload>

                </p:outputPanel>


                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check" actionListener="#{prendasBean.operar}" update="frm:dtPrendas" oncomplete="PF('dlgPrenda').hide();" process="@this datos"/>

                    <p:commandButton value="Cancelar" icon="pi pi-times" immediate="true" oncomplete="PF('dlgPrenda').hide();"/>
                </f:facet>
            </p:dialog>

            <p:confirmDialog widgetVar="borrarPrenda" showEffect="fade" width="300"
                             message="Borrar Prenda?" header="Confirmar" severity="warn">
                <p:commandButton value="Si" icon="pi pi-check" actionListener="#{prendasBean.eliminar}"
                                 oncomplete="PF('borrarPrenda').hide()" update="@form" process="@this"/>
                <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                 onclick="PF('borrarPrenda').hide();" />
            </p:confirmDialog>
        </h:form>
        
    </ui:define>

</ui:composition>
