<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">Salario mínimo</ui:define>
    <ui:define name="content">
	<script>
            PrimeFaces.locales['es'] = {
                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
                dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
                weekHeader: 'Semana',
                firstDay: 1,
                isRTL: false,
                showMonthAfterYear: false,
                yearSuffix: '',
                timeOnlyTitle: 'Sólo hora',
                timeText: 'Tiempo',
                hourText: 'Hora',
                minuteText: 'Minuto',
                secondText: 'Segundo',
                millisecondText: 'Milisegundo',
                ampm: false,
                month: 'Mes',
                week: 'Semana',
                day: 'Día',
                allDayText: 'Todo el día',
                today: 'Hoy',
                now: 'Ahora',
                clear: 'Limpiar',
                aria: {
                   close: 'Cerrar',
                   previous: 'Anterior',
                   next: 'Siguiente',
                }
            };
        </script>
        <h:form id="form">
            <p:growl id="messages" showDetail="true" life="4000"/>
            <p:dialog modal="true" widgetVar="statusDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
                <div align="center">
                    <i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
                </div>
            </p:dialog>
            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Agregar" icon="pi pi-plus" actionListener="#{salarioMinBean.nuevo()}" oncomplete="PF('dgSalario').show();" process="@this" update="form:dg-salario"/>
                </p:toolbarGroup>
            </p:toolbar>
            <div style="padding-top: 1rem">
                <p:dataTable id="dt-salario" widgetVar="dtSalario" value="#{salarioMinBean.salarios}" var="salario" allowUnsorting="true" sortMode="single">
                    <p:column headerText="Vigencia" style="text-align: center;">
                        <p:outputLabel value="#{salario.vigencia}">
                            <f:convertDateTime pattern="dd/MMM/yyyy" locale="es" timeZone="GMT-6:00"/>
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Zona General" style="text-align: center;">
                        <p:outputLabel value="#{salario.zonaG}">
                            <f:convertNumber pattern="$#,##0.00" />
                        </p:outputLabel>
                    </p:column>
                    <p:column headerText="Zona Libre Frontera Norte" style="text-align: center;">
                        <p:outputLabel value="#{salario.zonaLFN}">
                            <f:convertNumber pattern="$#,##0.00" />
                        </p:outputLabel>
                    </p:column>
                    <p:column style="text-align: center;">
                        <p:commandButton icon="pi pi-bars" onclick="PF('statusDialog').show();" oncomplete="PF('statusDialog').hide();PF('dgSalario').show();" actionListener="#{salarioMinBean.editar}" process="@this dt-salario" update="form:dg-salario">
                            <f:setPropertyActionListener value="#{salario}" target="#{salarioMinBean.salario}" />
                        </p:commandButton>
                        <p:commandButton icon="pi pi-times" styleClass="ui-button-danger" process="@this dt-salario" action="#{salarioMinBean.eliminar}">
                            <p:confirm header="Confirmación" message="¿Deseas eliminar este registro?" icon="pi pi-info-circle"/>
                            <f:setPropertyActionListener value="#{salario}" target="#{salarioMinBean.salario}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
            <p:dialog id="dg-salario" widgetVar="dgSalario" header="Salario mínimo" showEffect="hide" modal="true">
                <p:outputPanel class="ui-fluid">
                    <div class="p-field">
                        <p:outputLabel value="Vigencia"></p:outputLabel>
                        <p:datePicker value="#{salarioMinBean.salario.vigencia}" showIcon="true" yearNavigator="true" monthNavigator="true">
                        </p:datePicker>
                    </div>
                    <div class="p-field">
                        <p:outputLabel value="Zona General"></p:outputLabel>
                        <p:inputNumber value="#{salarioMinBean.salario.zonaG}" decimalPlaces="2" minValue="0.00" symbol="$" symbolPosition="p" ></p:inputNumber>
                    </div>
                    <div class="p-field">
                        <p:outputLabel value="Zona Libre Frontera Norte"></p:outputLabel>
                        <p:inputNumber value="#{salarioMinBean.salario.zonaLFN}" decimalPlaces="2" minValue="0.00" symbol="$" symbolPosition="p" ></p:inputNumber>
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" actionListener="#{salarioMinBean.guardar}" process="dg-salario @this" update="dt-salario" oncomplete="PF('dgSalario').hide(); PF('dg-menorAlMinimo').show()">
                    </p:commandButton>
                </f:facet>
            </p:dialog>
            <p:dialog id="dg-menorAlMinimo" widgetVar="dg-menorAlMinimo" header="Empleados por debajo del salario minimo" showEffect="hide" modal="true">

                <p:toolbar styleClass="mb-2">
                    <p:toolbarGroup>
                        <p:outputLabel id="toggleGeneral" value="Salario en zona general"/>
                        <p:toggleSwitch value="#{salarioMinBean.salarioGeneral}" >
                            <p:ajax event="change" listener="#{salarioMinBean.porDebajoMinimo()}" update="dg-menorAlMinimo" process="@this" oncomplete="PF('dg-menorAlMinimo').hide(); PF('dg-menorAlMinimo').show();"/>
                        </p:toggleSwitch>
                    </p:toolbarGroup>
                    <p:toolbarGroup>
                        <p:outputLabel id="toggleFrontera" value="Salario en zona de la Frontera"/>
                        <p:toggleSwitch value="#{salarioMinBean.salarioFrontera}" >
                            <p:ajax event="change" listener="#{salarioMinBean.porDebajoMinimo()}" update="dg-menorAlMinimo" process="@this" oncomplete="PF('dg-menorAlMinimo').hide(); PF('dg-menorAlMinimo').show();"/>
                        </p:toggleSwitch>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:toolbar styleClass="mb-1">
                    <p:toolbarGroup>
                        <p:outputLabel value="Salario minimo: #{salarioMinBean.salarioSugerido}"/>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dtEmpleadoPorDebajo" value="#{salarioMinBean.lstEmpleadosPorActualizar}" var="empleado" paginator="true" rows="5">
                    <p:column headerText="Nombre(s)" sortBy="#{empleado.nombre}" filterable="false">
                        <h:outputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.nombre}" />
                    </p:column>
                    <p:column headerText="Primer Apellido" sortBy="#{empleado.primerAp}" filterable="false">
                        <h:outputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.primerAp}" />
                    </p:column>
                    <p:column headerText="Segundo Apellido" sortBy="#{empleado.segundoAp}" filterable="false">
                        <h:outputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.segundoAp}" />
                    </p:column>
                    <p:column headerText="Salario Actual" sortBy="#{empleado.datoEmpresa.salarioDiario}" filterable="false">
                        <h:inputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.datoEmpresa.salarioDiario}" />
                    </p:column>
                </p:dataTable>
                <f:facet name="footer">
                    <p:commandButton value="Actualizar empleado(s)" icon="pi pi-check" styleClass="" actionListener="#{salarioMinBean.actualizarSalarios()}"  process="dg-menorAlMinimo @this" update="dg-menorAlMinimo" oncomplete="PF('dg-menorAlMinimo').hide(); PF('dg-menorAlMinimo').show();"/>
                    <p:commandButton value="Cerrar Dialogo" icon="pi pi-times" styleClass="ui-button-danger" actionListener="#{salarioMinBean.limpiarVariables()}" oncomplete="PF('dg-menorAlMinimo').hide();" update="dg-menorAlMinimo"/>
                </f:facet>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
