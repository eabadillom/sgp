<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/template.xhtml">
    <ui:define name="title">Registro de empleados</ui:define>
    <ui:define name="head">
        <h:outputScript library="recursos" name="js/primefaces_locale.js" />
    </ui:define>
    <ui:define name="content">
    	<f:event type="preRenderView" listener="#{registroEmpleadosBean.init()}" />
        <h:form id="form">
            <p:growl id="messages" showDetail="true" life="2500"/>
            <p:dialog modal="true" widgetVar="statusInfoDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
                <div align="center">
                    <i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
                </div>
            </p:dialog>
            <div class="grid table-demo">
                <div class="col-12">
                    <div class="card p-4">
                        <p:blockUI block="form:dialogBiometrico" widgetVar="bui"/>
                        <p:remoteCommand name="verificaEstado" onstart="PF('bui').hide();" actionListener="#{registroEmpleadosBean.validaHuella()}"/>
                        <p:toolbar styleClass="mb-4">
                            <p:toolbarGroup>
                                <p:commandButton value="Agregar" icon="pi pi-plus" actionListener="#{registroEmpleadosBean.agregarEmpleado()}" update="form:panelDialogEmpleado" oncomplete="PF('dialogEmpleado').show()" style="margin-right: .5rem" process="@this"/>
                            </p:toolbarGroup>
                            <p:toolbarGroup>
                                <p:selectOneMenu id="onemenuplanta" value="#{registroEmpleadosBean.planta}" converter="entityConverter">
                                    <f:selectItem itemLabel="Todas las plantas" itemValue="#{null}"/>
                                    <f:selectItems value="#{registroEmpleadosBean.lstCatPlanta}" var="planta" itemLabel="#{planta.descripcion}" itemValue="#{planta}"/>
                                    <p:ajax event="change"  update="dtEmpleados" process="@this" />
                                </p:selectOneMenu>
                            </p:toolbarGroup>
                            <p:toolbarGroup>
                                <p:selectOneMenu id="onemenuempresa" value="#{registroEmpleadosBean.empresa}" converter="entityConverter">
                                    <f:selectItem itemLabel="Todas las empresas" itemValue="#{null}"/>
                                    <f:selectItems value="#{registroEmpleadosBean.lstCatEmpresa}" var="empresa" itemLabel="#{empresa.descripcion}" itemValue="#{empresa}"/>
                                    <p:ajax event="change" update="dtEmpleados" process="@this" />
                                </p:selectOneMenu>
                            </p:toolbarGroup>
                            <p:toolbarGroup>
                                <p:outputLabel id="toggleactivo" value="Activo "/>
                                <p:toggleSwitch value="#{registroEmpleadosBean.activo}">
                                    <p:ajax  update="dtEmpleados" process="@this"/>
                                </p:toggleSwitch>
                            </p:toolbarGroup>
                            <p:toolbarGroup>
                                <p:outputLabel value="Inactivo "/>
                                <p:toggleSwitch id="toggleinactivo" value="#{registroEmpleadosBean.inactivo}">
                                    <p:ajax  update="dtEmpleados" process="@this"/>
                                </p:toggleSwitch>
                            </p:toolbarGroup>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Descargar" icon="pi pi-download" styleClass="ui-button-secondary" ajax="false">
                                    <p:dataExporter type="pdf" target="dtEmpleados" fileName="empleados"/>
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>

                        <p:dataTable id="dtEmpleados" widgetVar="dtEmpleados" var="empleado" value="#{registroEmpleadosBean.filtrarEmpleados()}" reflow="true" styleClass="products-table"
                                     selection="#{registroEmpleadosBean.lstEmpleadosSelected}" rowKey="#{empleado.idEmpleado}" paginator="true" rows="10" rowSelectMode="add" 
                                     paginatorPosition="bottom" lazy="true">

                            <f:facet name="header">
                                <div class="flex justify-content-start">
                                    <p:inputText id="filtarNombre" value="#{registroEmpleadosBean.texto}" onkeyup="PF('dtEmpleados').filter();" style="width:300px"
                                                 placeholder="Buscar empleado por nombre o apellidos">
                                        <p:ajax update="dtEmpleados" process="@this"/>
                                    </p:inputText>
                                </div>
                            </f:facet>

                            <p:column headerText="Número" sortBy="#{empleado.numEmpleado}" filterable="false" width="4rem">
                                <h:outputText value="#{empleado.numEmpleado}" styleClass="customer-badge status-#{registroEmpleadosBean.obtenerStatusEmpleadoEmpresa(empleado)}"/>
                            </p:column>
                            <p:column headerText="Primer Apellido" sortBy="#{empleado.primerAp}" filterable="false">
                                <h:outputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.primerAp}" />
                            </p:column>
                            <p:column headerText="Segundo Apellido" sortBy="#{empleado.segundoAp}" filterable="false">
                                <h:outputText style="vertical-alin: middle; margin-left: .5rem" value="#{empleado.segundoAp}" />
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{empleado.nombre}" filterable="false">
                                <h:outputText style="vertical-align: middle; margin-left: .5rem" value="#{empleado.nombre}" />
                            </p:column>
                            <p:column width="6rem">
                                <p:commandButton styleClass="edit-button m-1" action="#{registroEmpleadosBean.editar}" process="@this" update="form:panelDialogEmpleado form:panelDialogEmpleado:previewFingerprint1" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dialogEmpleado').show();" icon="pi pi-pencil">
                                    <f:setPropertyActionListener value="#{empleado}" target="#{registroEmpleadosBean.empleado}" />
                                </p:commandButton>
                                <p:commandButton class="ui-button-danger m-1" icon="pi pi-times" process="@this" actionListener="#{registroEmpleadosBean.validarEmpleado(empleado)}" oncomplete="PF('dg-eliminarEmpleado').show()" update=":form:dg-eliminarEmpleado" >
                                    <f:setPropertyActionListener value="#{empleado}" target="#{registroEmpleadosBean.empleado}" />
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>

                        <p:dialog header="Información..." showEffect="fade" modal="true" widgetVar="dialogEmpleado" responsive="true" resizable="false" width="100%" height="100%" position="center top" cache="false">
                            <p:tabView id="panelDialogEmpleado" class="ui-fluid" dynamic="true" effect="drop">
                                <p:ajax event="tabChange" update="form:panelDialogEmpleado form:panelDialogEmpleado:previewFotografia" oncomplete="PF('dialogEmpleado').initPosition();"/>
                                <p:tab title="Personal">
                                    <h4>Información del empleado</h4>
                                    <div class="formgrid grid">
                                        <div class="field col-4">
                                            <p:outputLabel for="@next" value="Número de empleado"/>
                                            <p:inputText id="numEmp" value="#{registroEmpleadosBean.empleado.numEmpleado}" disabled="true"/>  
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Nombre"/>
                                            <p:inputText id="nombreEmp" value="#{registroEmpleadosBean.empleado.nombre}" style="text-transform: uppercase">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Primer Apellido"/>
                                            <p:inputText id="primerAp" value="#{registroEmpleadosBean.empleado.primerAp}" style="text-transform: uppercase">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Segundo Apellido"/>
                                            <p:inputText id="segundoAp" value="#{registroEmpleadosBean.empleado.segundoAp}" style="text-transform: uppercase">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="CURP"/>
                                            <p:inputText id="curp" value="#{registroEmpleadosBean.empleado.curp}" maxlength="18" style="text-transform: uppercase">
                                                <p:ajax process="@this" />
                                            </p:inputText>  
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Fecha de nacimiento" />
                                            <p:datePicker id="fNac" value="#{registroEmpleadosBean.empleado.fechaNacimiento}" monthNavigator="true" yearNavigator="true" yearRange="1940:2015" pattern="dd/MM/yyyy" showIcon="true" locale="es" timeZone="GMT-6">
                                                <p:ajax process="@this" />
                                            </p:datePicker>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Correo"/>
                                            <p:inputText id="correo" value="#{registroEmpleadosBean.empleado.correo}">
                                                <p:ajax process="@this" />
                                            </p:inputText>  
                                        </div>
                                    </div>
                                    <h5>Domicilio fiscal</h5>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Codigo Postal"/>
                                            <p:autoComplete id="autocomplete"
                                            				value="#{registroEmpleadosBean.empleado.domicilio.asentamiento}"
                                            				completeMethod="#{registroEmpleadosBean.sugerenciasCodigoPostal}" 
                                                            placeholder="Escribe el codigo postal..."
                                                            var="sugerencia"
                                                            itemLabel="#{sugerencia.cp}"
                                                            itemValue="#{sugerencia}" 
                                                            forceSelection="true"
                                                            minQueryLength="5"
                                                            maxlength="5"
                                                            converter="entityConverter">
                                                <p:ajax process="@this" event="itemSelect" listener="#{registroEmpleadosBean.asignarDomicilio()}" update=":form:panelDialogEmpleado"/>
                                                <p:column>
                                                    <p:outputLabel value="#{sugerencia.cp}"/>
                                                </p:column>
                                                <p:column>
                                                    <p:outputLabel value="#{sugerencia.descripcion}"/>
                                                </p:column>
                                            </p:autoComplete>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Pais" />
                                            <p:inputText id="pais" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.key.estado.key.pais.nombre}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Estado" />
                                            <p:inputText id="estado" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.key.estado.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Municipio" />
                                            <p:inputText id="municipio" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Localidad" />
                                            <p:inputText id="localidad" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Asentamiento" />
                                            <p:inputText id="asentamiento" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Calle" />
                                            <p:inputText id="calle" value="#{registroEmpleadosBean.empleado.domicilio.calle}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Num. Ext." />
                                            <p:inputText id="numExt" value="#{registroEmpleadosBean.empleado.domicilio.numeroExterior}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Num. Int" />
                                            <p:inputText id="numInt" value="#{registroEmpleadosBean.empleado.domicilio.numeroInterior}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                </p:tab>
                                <p:tab title="Empresarial">
                                    <div class="card">
                                        <div class="ui-fluid formgrid grid align-items-left">
                                        	<div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="RFC" />
                                                <p:inputText id="rfc" value="#{registroEmpleadosBean.datoEmpresa.rfc}" maxlength="18" style="text-transform: uppercase">
                                                    <p:ajax process="@this"/>
                                                </p:inputText>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Fecha de ingreso" />
                                                <p:datePicker id="fIngreso" value="#{registroEmpleadosBean.datoEmpresa.fechaIngreso}" weekCalculator="true" monthNavigator="true" yearNavigator="true" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy">
                                                    <p:ajax process="@this" event="change" listener="#{registroEmpleadosBean.calcularPeriodoVacacional()}"/>
                                                </p:datePicker>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Fecha de baja" />
                                                <p:datePicker id="fechaBaja" value="#{registroEmpleadosBean.datoEmpresa.fechaBaja}" weekCalculator="true" monthNavigator="true" yearNavigator="true" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy">
                                                    <p:ajax process="@this"/>
                                                </p:datePicker>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="NSS" />
                                                <p:inputText id="nss" value="#{registroEmpleadosBean.datoEmpresa.nss}" maxlength="15" style="text-transform: uppercase">
                                                    <p:ajax process="@this"/>
                                                </p:inputText>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Salario Diario" />
                                                <p:inputNumber id="salario" value="#{registroEmpleadosBean.datoEmpresa.salarioDiario}" symbol="$ " symbolPosition="p" decimalSeparator="." decimalPlaces="2">
                                                    <p:ajax process="@this"/>
                                                </p:inputNumber>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Perfil" />
                                                <p:selectOneMenu id="soPerfil" value="#{registroEmpleadosBean.datoEmpresa.perfil}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstCatPerfil}" var="perfil" itemValue="#{perfil}" itemLabel="#{perfil.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Empresa" />
                                                <p:selectOneMenu id="soEmpresa" value="#{registroEmpleadosBean.datoEmpresa.empresa}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstCatEmpresa}" var="empresa" itemValue="#{empresa}" itemLabel="#{empresa.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Puesto" />
                                                <p:selectOneMenu id="soPuesto" value="#{registroEmpleadosBean.datoEmpresa.puesto}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstCatPuesto}" var="puesto" itemValue="#{puesto}" itemLabel="#{puesto.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Área" />
                                                <p:selectOneMenu id="soArea" value="#{registroEmpleadosBean.datoEmpresa.area}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstCatArea}" var="area" itemValue="#{area}" itemLabel="#{area.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Ubicación" />
                                                <p:selectOneMenu id="soUbica" value="#{registroEmpleadosBean.datoEmpresa.planta}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstCatPlanta}" var="planta" itemValue="#{planta}" itemLabel="#{planta.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Tipo de contrato" />
                                                <p:selectOneMenu id="soTipoContrato" value="#{registroEmpleadosBean.datoEmpresa.tipoContrato}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
                                                    <f:selectItems value="#{registroEmpleadosBean.tiposContrato}" var="tipoContrato" itemValue="#{tipoContrato}" itemLabel="#{tipoContrato.clave} - #{tipoContrato.nombre}" />
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Tipo de jornada" />
                                                <p:selectOneMenu id="soTipoJornada" value="#{registroEmpleadosBean.datoEmpresa.tipoJornada}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.tiposJornada}" var="tipoJornada" itemValue="#{tipoJornada}" itemLabel="#{tipoJornada.clave} - #{tipoJornada.nombre}"></f:selectItems>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Tipo de régimen"/>
                                                <p:selectOneMenu id="soTipoRegimen" value="#{registroEmpleadosBean.datoEmpresa.tipoRegimen}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
                                                    <f:selectItems value="#{registroEmpleadosBean.tiposRegimen}" var="tipoRegimen" itemValue="#{tipoRegimen}" itemLabel="#{tipoRegimen.clave} - #{tipoRegimen.nombre}"></f:selectItems>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Hora de entrada" />
                                                <p:datePicker id="dpHoraEntrada" value="#{registroEmpleadosBean.datoEmpresa.horaEntrada}" timeOnly="true" timeZone="GMT-6" locale="es">
                                                    <p:ajax process="@this"/>
                                                </p:datePicker>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Hora de salida" />
                                                <p:datePicker id="dpHoraSalida" value="#{registroEmpleadosBean.datoEmpresa.horasalida}" timeOnly="true" timeZone="GMT-6" locale="es">
                                                    <p:ajax process="@this"/>
                                                </p:datePicker>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Tolerancia (minutos)"></p:outputLabel>
                                                <p:inputNumber id="minutosTolerancia" value="#{registroEmpleadosBean.datoEmpresa.minutosTolerancia}">
                                                    <p:ajax process="@this"/>
                                                </p:inputNumber>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Entidad Federativa" />
                                                <p:selectOneMenu id="soEntidadFederativa" value="#{registroEmpleadosBean.datoEmpresa.entidadFederativa}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.entidadesFederativas}" var="entidad" itemLabel="#{entidad.clave} - #{entidad.nombre}" itemValue="#{entidad}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Riesgo puesto" />
                                                <p:selectOneMenu id="soRiesgoPuesto" value="#{registroEmpleadosBean.datoEmpresa.riesgoPuesto}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.riesgosPuesto}" var="riesgo" itemLabel="#{riesgo.clave} - #{riesgo.descripcion}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Periodicidad de pago" />
                                                <p:selectOneMenu id="soPeriodicidadPago" value="#{registroEmpleadosBean.datoEmpresa.periodicidadPago}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.periodicidadesPago}" var="periodicidad" itemLabel="#{periodicidad.periodicidad} - #{periodicidad.descripcion}" itemValue="#{periodicidad}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                                <p:outputLabel for="@next" value="Banco registrado" />
                                                <p:selectOneMenu id="soBancoRegistrado" value="#{registroEmpleadosBean.datoEmpresa.banco}" autoWidth="false" converter="entityConverter">
                                                    <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                    <f:selectItems value="#{registroEmpleadosBean.lstBancos}" var="banco" itemLabel="#{banco.idBanco} - #{banco.descripcion}" itemValue="#{banco}"/>
                                                    <p:ajax process="@this"/>
                                                </p:selectOneMenu>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                            	<p:outputLabel for="@next" value="Días de aguinaldo" />
                                            	<p:inputNumber id="diasAguinaldo" value="#{registroEmpleadosBean.datoEmpresa.diasAguinaldo}" symbol=" días" symbolPosition="s" placeholder="días" inputStyle="text-align: right">
                                            		<p:ajax process="@this"/>
                                            	</p:inputNumber>
                                            </div>
                                            <div class="field col-12 md:col-3">
                                            	<p:outputLabel for="@next" value="Prima vacacional" />
                                            	<p:inputNumber id="primaVacacional" value="#{registroEmpleadosBean.datoEmpresa.primaVacacional}" symbol=" %" symbolPosition="s" placeholder="%" inputStyle="text-align: right">
                                            		<p:ajax process="@this"/>
                                            	</p:inputNumber>
                                            </div>
                                            <div class="field col-12 md:col-3">

            <script>
                $('.respresultado').hide();
                $(".clean").click(function () {
                    $('.respresultado').hide();
                });

                function createCORSRequest(method, url) {
                    var xhr = new XMLHttpRequest();
                    if ("withCredentials" in xhr) {
                        xhr.open(method, url, true);
                    } else if (typeof XDomainRequest != "undefined") {
                        xhr = new XDomainRequest();
                        xhr.open(method, url, true);
                    } else {
                        xhr = null;
                    }
                    return xhr;
                }

                function InvokeFingerScan(TpAccion, payload, signature) {
                    var url = "http://localhost:8090/finger";
                    var request = createCORSRequest('POST', url);
                    if (!request) {
                        throw new Error('CORS not supported');
                    }
                    request.setRequestHeader("Content-Type", "application/json");

                    request.onreadystatechange = function () {
                        if (this.readyState == 4) {
                            if (this.status == 200) {
                                var dataValue = {"cipherText": request.responseText};
                                var response = JSON.parse(request.responseText);
                                console.log(response);
                                if (response != null) {
                                    //En la respuesta 
                                    if (response.biometricData1 != null) {
                                        document.getElementById('form:biometrico').value = response.biometricData1;
                                        $(".successfull").show(300);
                                        verificaEstado();
                                    } else {
                                        if (response.verifyBiometricData == true) {
                                            $(".verifyfingerprintOk").html("!!! Fingerprint Match !!!");
                                            $(".verifyfingerprintOk").show(300);
                                        } else {
                                            $(".badrequest").html("!!! Fingerprint Not Match !!!");
                                            $(".badrequest").show(300);
                                        }
                                    }
                                }
                            } else {
                            }
                        }
                    };
                    request.onerror = function () {
                        console.error('Ocurrió un error al hacer una solicitud de adquisición de datos.');
                    };
                    request.ontimeout = function () {
                        console.error("La solicitud de adquisición de datos ha expirado.");
                    };

                    var obj = new Object();
                    obj.tpAccion = TpAccion;
                    var jsonString = JSON.stringify(obj);
                    request.send(jsonString);
                }
            </script>
