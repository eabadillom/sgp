<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">
	
    <div class="ui-fluid formgrid grid">
    	<div class="field col-12 md:col-2">
    		<p:datePicker value="#{vacacionesBean.periodoInicio}" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy" showIcon="true">
    			<p:ajax process="@this" event="change" listener="#{vacacionesBean.cargarPermisos()}"  update="formActividades:tabView:dtVacaciones" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
    		</p:datePicker>
    	</div>
    	<div class="field col-12 md:col-2">
    		<p:datePicker value="#{vacacionesBean.periodoFin}" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy" showIcon="true">
    			<p:ajax process="@this" event="change" listener="#{vacacionesBean.cargarPermisos()}" update="formActividades:tabView:dtVacaciones" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
    		</p:datePicker>
    	</div>
    	<div class="field col-12 md:col-4">
    		<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
    	</div>
    	<div class="field col-12 md:col-2">
    		<p:selectBooleanButton value="#{vacacionesBean.mostrarCanceladas}" onIcon="pi pi-eye" onLabel="Canceladas" offIcon="pi pi-eye-slash" offLabel="Canceladas">
    			<p:ajax event="change" process="@this" update="formActividades:tabView:dtVacaciones" listener="#{vacacionesBean.cargarPermisos()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
    		</p:selectBooleanButton>
    	</div>
    	<div class="field col-12 md:col-2">
            <p:commandButton value="Registrar" icon="pi pi-plus" process="@this" actionListener="#{vacacionesBean.nuevoPermiso()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dgVacaciones').show();" update="formActividades:tabView:dg-vacaciones">
            </p:commandButton>
    	</div>
    </div>
    
    <div align="center">
    	<div style="width: 30rem;">
		    <p:dataTable id="dtVacaciones" widgetVar="dtVacaciones" var="permiso" value="#{vacacionesBean.permisos}" rowKey="#{solicitud.idSolicitud}" paginator="true" rows="5" paginatorPosition="bottom">
		        <p:column headerText="Del" sortBy="#{permiso.solPermiso.fechaInicio}">
		            <p:outputLabel value="#{permiso.solPermiso.fechaInicio}">
		                <f:convertDateTime type="date" pattern="dd/MM/yyyy" timeZone="GMT-6"/>
		            </p:outputLabel>
		        </p:column>
		        <p:column headerText="Al" sortBy="#{permiso.solPermiso.fechaFin}">
		            <p:outputLabel value="#{permiso.solPermiso.fechaFin}">
		                <f:convertDateTime type="date" pattern="dd/MM/yyyy" timeZone="GMT-6"/>
		            </p:outputLabel>
		        </p:column>
		        <p:column headerText="Status" sortBy="#{permiso.solPermiso.estatus.descripcion}">
		            <span class="customer-badge status-#{vacacionesBean.status.getStatusClass(permiso.solPermiso.estatus.clave)}" style="display: block; width: 7rem">
		                #{vacacionesBean.status.getStatusText( permiso.solPermiso.estatus.clave)}
	                </span>
		        </p:column>
		        <p:column style="width: 2rem">
		            <p:commandButton class="ui-button-success rounded-button m-1" icon="pi pi-bars" process="@this" styleClass="edit-button"
		                             action="#{vacacionesBean.cargarPermiso(permiso)}" update="formActividades:tabView:dg-vacaciones" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dgVacaciones').show();">
		            </p:commandButton>
		        </p:column>
		    </p:dataTable>
    		
    	</div>
    </div>
    
	<p:dialog id="dg-vacaciones" widgetVar="dgVacaciones" header="Vacaciones" showEffect="fade" responsive="true" modal="true">
		<p:toolbar>
			<p:toolbarGroup align="left">
				<p:commandButton icon="pi pi-plus" value="Periodo en curso" actionListener="#{vacacionesBean.cargarPeriodoEnCurso}" update="dt-periodos-vacacionales" >
					<p:confirm header="Año laboral no cumplido" message="No has cumplido el año laboral, ¿estás seguro que deseas agregar el periodo vacacional?" icon="pi pi-exclamation-triangle" />
				</p:commandButton>
			</p:toolbarGroup>
			<p:toolbarGroup align="right">
				<p:selectBooleanButton value="#{vacacionesBean.desbloquearDiasDeDescanso}" onIcon="pi pi-lock-open" offIcon="pi pi-lock" onLabel="Días de descanso" offLabel="Días de descanso">
					<p:ajax process="@this" event="valueChange" listener="#{vacacionesBean.mostrarDiasDeDescanso}" update="formActividades:tabView:dpView" />
				</p:selectBooleanButton>
				<p:selectBooleanButton value="#{vacacionesBean.desbloquearDiasNoLaborales}" onIcon="pi pi-lock-open" offIcon="pi pi-lock" onLabel="Días no laborales" offLabel="Días no laborales">
					<p:ajax process="@this" event="valueChange" listener="#{vacacionesBean.mostrarDiasLaborales}" update="formActividades:tabView:dpView" />
				</p:selectBooleanButton>
			</p:toolbarGroup>
		</p:toolbar>
		<p:panelGrid layout="tabular" columns="0" styleClass="ui-noborder"><!-- Sin bordes, agregar propiedad  styleClass="ui-noborder"-->
			<p:row>
				<p:column width="10rem" style="vertical-align: top;">
					<p:card>
						<p:dataTable id="dt-periodos-vacacionales" widgetVar="dtPeriodosVacaciones" var="periodo" value="#{vacacionesBean.periodosVacacionales}"
			                         paginator="true" rows="4" paginatorPosition="bottom" selectionMode="single"
			                         selection="#{vacacionesBean.permiso.solPermiso.vacaciones}" rowKey="#{periodo.idVacaciones}" >
			                <p:ajax event="rowSelect" listener="#{vacacionesBean.onPeriodoSelect}" update="formActividades:tabView:dpView"/>
			                <p:column headerText="Periodo inicio" style="text-align: center;">
			                    <p:outputLabel value="#{periodo.fechaInicio}">
			                    	<f:convertDateTime pattern="dd 'de' MMM 'de' yyyy" locale="es_MX" timeZone="GMT-6" />
			                    </p:outputLabel>
			                </p:column>
			                <p:column headerText="Periodo fin" style="text-align: center;">
			                    <p:outputLabel value="#{periodo.fechaFin}">
			                    	<f:convertDateTime pattern="dd 'de' MMM 'de' yyyy" locale="es_MX" timeZone="GMT-6" />
			                    </p:outputLabel>
			                </p:column>
			                <p:column headerText="Total" width="4rem" style="text-align: center;">
			                    <p:outputLabel value="#{periodo.diasTotales} día(s)"/>
			                </p:column>
			                <p:column headerText="Disponibles" width="6rem" style="text-align: center;">
			                    <p:outputLabel value="#{periodo.diasDisponibles} día(s)"/>
			                </p:column>
			            </p:dataTable>
					</p:card>
				</p:column>
				<p:column rowspan="2">
					<p:card>
						<p:datePicker id="dpView" styleClass="ferbo-datePicker"  disabled="#{vacacionesBean.permiso.solPermiso.vacaciones eq null}" readonlyInput="true"
		                          inline="true" pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX" value="#{vacacionesBean.diasSolicitados}"
		                          mindate="#{vacacionesBean.permiso.solPermiso.fechaInicio}" maxdate="#{vacacionesBean.permiso.solPermiso.fechaFin}"
		                          selectionMode="multiple" disabledDays="#{vacacionesBean.invalidDays}"
		                          disabledDates="#{vacacionesBean.diasDeAsueto}">
			            </p:datePicker>
					</p:card>
				</p:column>
			</p:row>
			
			<p:row>
				<p:column style="vertical-align: bottom;">
					<p:card id="resumen">
						<div align="center">
							<p:outputLabel value="#{vacacionesBean.mensajeConfirmacion}" />
						</div>
						<div align="center">
							<p:outputLabel value="#{vacacionesBean.permiso.solPermiso.estatus.descripcion}" rendered="#{vacacionesBean.permiso.idIncidencia ne null}" styleClass="customer-badge status-#{vacacionesBean.status.getStatusClass(permiso.solPermiso.estatus.clave)}"/>
						</div>
						<div align="center">
							<div>
								<p:outputLabel value="Motivo de rechazo:" rendered="#{vacacionesBean.permiso.solPermiso.estatus.clave eq 'R'}" styleClass="customer-badge status-#{vacacionesBean.status.getStatusClass(permiso.solPermiso.estatus.clave)}"/>
							</div>
							<div>
								<p:inputText id="txtMotivo" value="#{vacacionesBean.permiso.solPermiso.descripcionRechazo}" disabled="true" rendered="#{vacacionesBean.permiso.solPermiso.estatus.clave eq 'R'}"/>
							</div>
						</div>
					</p:card>
				</p:column>
			</p:row>
			
		</p:panelGrid>

        <f:facet name="footer">
            <p:commandButton value="Cancelar" icon="pi pi-times" actionListener="#{vacacionesBean.cancelar()}" process="@this" update="formActividades:tabView:dtVacaciones" rendered="#{vacacionesBean.permiteCancelar()}" styleClass="ui-button-outlined ui-button-danger" onstart="PF('statusInfoDialog').show();"  oncomplete="PF('statusInfoDialog').hide();">
            	<p:confirm header="Cancelar permiso" message="¿Está seguro que desea cancelar este permiso?" icon="pi pi-exclamation-triangle" />
            </p:commandButton>
            <p:commandButton value="Actualizar" icon="pi pi-save" actionListener="#{vacacionesBean.actualizar()}" process="@this" update="formActividades:tabView:dtVacaciones" rendered="#{vacacionesBean.permiteActualizar()}" styleClass="ui-button-outlined" onstart="PF('statusInfoDialog').show();"  oncomplete="PF('statusInfoDialog').hide();">
            	<p:confirm header="Actualizar permiso" message="¿Está seguro que desea actualizar este periodo?" icon="pi pi-exclamation-triangle" />
            </p:commandButton>
            <p:commandButton id="cmdSolicitar" value="Solicitar" icon="pi pi-check" process="@this dpView" actionListener="#{vacacionesBean.guardar()}" rendered="#{vacacionesBean.permiso.idIncidencia eq null}" update="formActividades:tabView:dtVacaciones" onstart="PF('statusInfoDialog').show();"  oncomplete="PF('statusInfoDialog').hide();">
				<p:confirm header="Solicitar permiso" message="¿Está seguro que desea registrar este periodo?" icon="pi pi-exclamation-triangle" />
			</p:commandButton>
            <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dgVacaciones').hide()" class="ui-button-secondary"/>
        </f:facet>
	</p:dialog>
    
    <style>
        .ferbo-datePicker .ui-datepicker-calendar td a.ui-state-active{
            background: #77ff00 !important;
        }
    </style>
</ui:composition>
