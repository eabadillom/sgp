<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">
    <p:toolbar styleClass="mb-0 p-0" style="border: none">
        <p:toolbarGroup align="left">
            <p:commandButton value="Registrar" icon="pi pi-plus" class="ui-button-success m-1" styleClass="edit-button" style="margin-right: .5rem" process="@this"
                             actionListener="#{asistenciaBean.validarDiasEmpleado()}" >
            </p:commandButton>
        </p:toolbarGroup>
    </p:toolbar>
    <p:dataTable id="dtSolicitudes" widgetVar="dtSolicitudes" var="solicitud" value="#{asistenciaBean.lstSolicitudes}" reflow="true"
                 selection="#{asistenciaBean.solicitudSelected}" rowKey="#{solicitud.idSolicitud}" 
                 paginator="true" rows="5" paginatorPosition="bottom" rowSelectMode="add" lazy="true" >
        <p:column headerText="Tipo de solicitud">
            <p:outputLabel value="#{solicitud.tipoSolicitud.descripcion}" />
        </p:column>
        <p:column headerText="Inicio" sortBy="#{solicitud.fechaInicio}" filterBy="#{solicitud.fechaInicio}">
            <p:outputLabel value="#{solicitud.fechaInicio}">
                <f:convertDateTime type="date" pattern="dd-MM-yyyy" timeZone="GMT-6"/>
            </p:outputLabel>
        </p:column>
        <p:column headerText="Fin" sortBy="#{solicitud.fechaFin}" filterBy="#{solicitud.fechaFin}">
            <p:outputLabel value="#{solicitud.fechaFin}">
                <f:convertDateTime type="date" pattern="dd-MM-yyyy" timeZone="GMT-6"/>
            </p:outputLabel>
        </p:column>
        <p:column headerText="Estatus" sortBy="#{solicitud.estatus}" filterBy="#{solicitud.estatus}">
            <span class="customer-badge status-#{asistenciaBean.status.getStatusClass(solicitud.estatus.clave)}" style="display: block; width: 7rem">
                #{asistenciaBean.status.getStatusText(solicitud.estatus.clave)}</span>
        </p:column>
        <p:column style="width: 4rem">
            <p:commandButton class="ui-button-success rounded-button m-1" icon="pi pi-bars" process="@this" styleClass="edit-button"
                             action="#{asistenciaBean.actualizaCalendarioSeleccionado()}" update="formActividades:tabView:dialogVacacionesView">
                <f:setPropertyActionListener value="#{solicitud}" target="#{asistenciaBean.solicitudSelected}" for="@previous"/>
            </p:commandButton>
        </p:column>
    </p:dataTable>

    <p:dialog widgetVar="dialogVacaciones" header="Registrar solicitud" showEffect="fade" responsive="true" modal="true" styleClass="ferbo-dialog" 
              dynamic="true" resizable="false" height="100%" width="35rem" position="center top" cache="false" >
        <p:outputPanel id="pnlDetalleVacaciones" styleClass="ui-fluid">

            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="soTipoPermiso" value="Tipo"/>
                    <p:selectOneMenu id="soTipoPermiso" autoWidth="false" converter="entityConverter" 
                                     value="#{asistenciaBean.solicitudSelected.tipoSolicitud}">
                        <f:selectItem itemLabel="--Seleccione--"/>
                        <f:selectItems value="#{asistenciaBean.lstTipoSol}" var="idTipoSolicitud" itemValue="#{idTipoSolicitud}" itemLabel="#{idTipoSolicitud.descripcion}"/>
                        <p:ajax event="change" update="formActividades:tabView:pnlDetalleVacaciones" process="@this" resetValues="true"/>
                    </p:selectOneMenu>
                    <p:message for="soTipoPermiso"/>
                </div>
            </div>
            <p:dataTable id="dtPeriodosVacaciones" widgetVar="dtPeriodosVacaciones" var="periodo" value="#{asistenciaBean.periodosVacacionales}" reflow="true"
                         rowKey="#{periodo.idVacaciones}" paginator="true" rows="4" paginatorPosition="bottom"
                         rendered="#{asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud ne null and asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud eq 2}"
                         selection="#{asistenciaBean.periodoVacacional}" >
                <p:ajax event="rowSelectRadio" listener="#{asistenciaBean.onPeriodoSelect}"/>
                <!-- <p:ajax event="rowUnselect" listener="#{asistenciaBean.onPeriodoUnselect}" update=":formActividades:messages"/> -->
                
                <p:column selectionMode="single"  width="2rem" style="text-align:center">
                </p:column>
                
                
                <p:column headerText="Periodo" width="15rem" style="text-align: center;">
                    <p:outputLabel value="#{asistenciaBean.formatoPeriodo(periodo)}" />
                </p:column>
                <p:column headerText="Dias disponibles" width="8rem" style="text-align: center;">
                    <p:outputLabel value="#{periodo.diasTotales - periodo.diasTomados - periodo.diasPagados}"/>
                </p:column>    
            </p:dataTable>
            <p:outputLabel value="Total de dias disponibles: #{asistenciaBean.diasTotalesPermitidos}" style="text-align: right;" rendered="#{asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud ne null 
                                                               and asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud eq 2}"/>
			<div align="center" style="width: 30rem">
	            <p:datePicker id="dpRango"  rendered="#{asistenciaBean.periodoVacacional ne null 
	                                                    and asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud eq 2}"
	                           
	                          pattern="dd-MM-yyyy" showIcon="true" readonlyInput="true" timeZone="GMT-6" value="#{asistenciaBean.lstRangoRegistro}"
	                          mindate="#{asistenciaBean.minDate}" inline="true" selectionMode="range" disabledDays="#{asistenciaBean.invalidDays}"
	                          disabledDates="#{asistenciaBean.diasDeAsueto}"/>
	                          
	                          
	            <p:datePicker id="dpSimple" rendered="#{asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud ne null 
	                                                    and asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud eq 1}" 
	                          styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" 
	                          pattern="dd-MM-yyyy" showIcon="true" readonlyInput="true" timeZone="GMT-6" value="#{asistenciaBean.fechaSeleccionada}"
	                          mindate="#{asistenciaBean.minDate}" inline="true" disabledDays="#{asistenciaBean.invalidDays}" 
	                          disabledDates="#{asistenciaBean.diasDeAsueto}"/>
			</div>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Guardar" icon="pi pi-save" actionListener="#{asistenciaBean.guardaSolicitud()}" 
                             process="pnlDetalleVacaciones @this" update="pnlDetalleVacaciones dtSolicitudes"/>
            <p:commandButton value="Cancelar" icon="pi pi-times" onclick="PF('dialogVacaciones').hide()" class="ui-button-secondary" />
        </f:facet>
    </p:dialog>

    <p:dialog id="dialogVacacionesView" widgetVar="dialogVacacionesView" header="Detalle solicitud" showEffect="fade" responsive="true" 
              modal="true" styleClass="ferbo-dialog" dynamic="true" cache="false">
        <p:outputPanel id="pnlDetalleVacacionesView" styleClass="ui-fluid">

            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="soTipoPermisoView" value="Tipo"/>
                    <p:selectOneMenu id="soTipoPermisoView" autoWidth="false" value="#{asistenciaBean.solicitudSelected.tipoSolicitud.idTipoSolicitud}" 
                                     disabled="true">
                        <f:selectItem itemLabel="--Seleccione--"/>
                        <f:selectItems value="#{asistenciaBean.lstTipoSol}" var="tipoV" itemLabel="#{tipoV.descripcion}" itemValue="#{tipoV.idTipoSolicitud}"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel for="soEstatusView" value="Estatus"/>
                    <p:selectOneMenu id="soEstatusView" autoWidth="false" value="#{asistenciaBean.solicitudSelected.estatus.id}" disabled="true">
                        <f:selectItem itemLabel="ENVIADA" itemValue="1"/>
                        <f:selectItem itemLabel="APROBADA" itemValue="2"/>
                        <f:selectItem itemLabel="RECHAZADA" itemValue="3"/>
                        <f:selectItem itemLabel="CANCELADA" itemValue="4"/>
                    </p:selectOneMenu>
                </div>
            </div>
            <p:panel visible="#{asistenciaBean.solicitudSelected.estatus.clave.matches('R')}">
                <p:outputLabel for="txtMotivo" value="Motivo"/>
                <p:inputTextarea id="txtMotivo" value="#{asistenciaBean.solicitudSelected.descripcionRechazo}" disabled="true"/>
            </p:panel>
            <div class="formgrid grid" >
                <div class="field col" >
                    <p:outputLabel value="Dias de #{asistenciaBean.solicitudSelected.tipoSolicitud.descripcion} Solicitados"/>
                    <p:inputText value="#{asistenciaBean.totalDiasTomados}" disabled="true"/>
                </div>
            </div>
            <div class="formgrid grid" >
                <div class="field col" style="width: 8rem" >
                    <p:outputLabel value="Inicio de Vacaciones"/>
                    <p:inputText value="#{asistenciaBean.solicitudSelected.fechaInicio}" disabled="true" >
                        <f:convertDateTime type="date" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </p:inputText>
                </div>
                <div class="field col" style="width: 8rem" >
                    <p:outputLabel value="Termino de Vacaciones" />
                    <p:inputText value="#{asistenciaBean.solicitudSelected.fechaFin}" disabled="true">
                        <f:convertDateTime type="date" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
                    </p:inputText>
                </div>
            </div>
            <p:datePicker id="dpView" styleClass="ferbo-datePicker" panelStyleClass="ferbo-datePicker-panel" disabled="false" readonlyInput="true" 
                          timeZone="GMT-06" value="#{asistenciaBean.fechaDatePickerView}"
                          mindate="#{asistenciaBean.solicitudSelected.fechaInicio}" maxdate="#{asistenciaBean.solicitudSelected.fechaFin}"
                          inline="true" selectionMode="range" disabledDays="#{asistenciaBean.invalidDays}" 
                          disabledDates="#{asistenciaBean.diasDeAsueto}" />
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Cancelar" icon="pi pi-check" actionListener="#{asistenciaBean.actualizarSolicitud()}" 
                             process="pnlDetalleVacacionesView @this" update="pnlDetalleVacaciones dtSolicitudes"
                             styleClass="ui-button-raised ui-button-danger" 
                             disabled="#{(asistenciaBean.solicitudSelected.estatus.clave.matches('A') eq true 
                                         or asistenciaBean.solicitudSelected.estatus.clave.matches('R') eq true 
                                         or asistenciaBean.solicitudSelected.estatus.clave.matches('C') eq true)}"/>
            <p:commandButton value="Cerrar" icon="pi pi-times" actionListener="#{asistenciaBean.cerrarDialogoVacacionesView()}" 
                             onclick="PF('dialogVacacionesView').hide()" class="ui-button-secondary" immediate="true" />
        </f:facet>
    </p:dialog>
    <style>
        .ferbo-datePicker .ui-datepicker-calendar td a.ui-state-active{
            background: #77ff00 !important;
        }
    </style>
</ui:composition>
