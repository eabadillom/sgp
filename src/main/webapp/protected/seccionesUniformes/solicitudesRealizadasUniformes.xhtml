<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf"
                xmlns:h="http://xmlns.jcp.org/jsf/html">

    <p:dataTable id="dt-uniformes-sol" widgetVar="dtUniformes"
                 var="uniforme" value="#{uniformesBean.lstSolicitudPrendasRealizadas}"
                 reflow="true" styleClass="products-table" rowKey="uniforme.idSolicitud" paginator="true" rows="10" rowSelectMode="add" paginatorPosition="bottom">
        <p:column headerText="Prenda" sortBy="#{uniforme.prenda.idPrenda}" width="100px">
            <h:outputText value="#{uniforme.prenda.descripcion}" />
        </p:column>
        <p:column headerText="Imagen" width="100px">
            <h:graphicImage url="/imagen/uniforme?name=#{uniforme.prenda.descripcion}.jpg" width="57" />
        </p:column>
        <p:column headerText="Precio" sortBy="#{uniforme.cantidad}" width="100px">
            <h:outputText value="Precio Individual: $#{uniforme.prenda.precio} / Precio Total: $#{uniforme.prenda.precio * uniforme.cantidad}" />
        </p:column>
        <p:column headerText="Cantidad" sortBy="#{uniforme.cantidad}" width="100px">
            <h:outputText value="#{uniforme.cantidad}" />
        </p:column>
        <p:column headerText="Talla" sortBy="#{uniforme.talla.idTalla}" width="100px">
            <h:outputText value="#{uniforme.talla.descripcion}" />
        </p:column>
        <p:column headerText="Fecha" sortBy="#{uniforme.fechaCap}" sortOrder="descending" width="100px">
            <h:outputText value="#{uniforme.fechaCap}" >
                <f:convertDateTime pattern="yyyy-MM-dd hh:mm a" timeZone="Mexico/General"/>
            </h:outputText>
        </p:column>
        <p:column headerText="Estatus" sortBy="#{uniforme.estatus}" width="100px">
            <span class="customer-badge status-#{uniformesBean.status.getStatusClass(uniforme.estatus.clave)}" style="display: block; width: 7rem">
                #{uniformesBean.status.getStatusText(uniforme.estatus.clave)}
            </span>
        </p:column>
        <p:column width="100px">
            <p:commandButton class="rounded-button ui-button-warning" process="@this" icon="pi pi-bars"
                             oncomplete="PF('dialogCambiarEstatus').show()" styleClass="edit-button"
                             actionListener="#{uniformesBean.editarUniforme(uniforme)}">
                <f:setPropertyActionListener value="#{uniforme}" target="#{uniformesBean.solicitud}" />
            </p:commandButton>
        </p:column>
    </p:dataTable>
    <p:dialog header="Detalle Estatus" id="dialogCambiarEstatus" showEffect="fade" modal="true" draggable="false" resizable="false"
        widgetVar="dialogCambiarEstatus" responsive="true" dynamic="true" cache="false" closable="false" 
        closeOnEscape="false" styleClass="ferbo-dialog-complemento-prenda">
        <p:outputPanel id="pnlCancelar" rendered="#{uniformesBean.solicitud ne null}">
            <div class="formgrid grid">
                <div class="field col">
                    <p:outputLabel id="soPrenda" value="#{uniformesBean.solicitud.prenda.descripcion}" style="display:block ;font-size: 1.6rem;font-weight: 700;"/>
                </div>
            </div>
            <div class="formgrid grid">
                <div class="field col">
                    <!-- <h:graphicImage id="imgPrenda" name="images/prendas/#{uniformesBean.solicitud.prenda.descripcion}.jpg" library="recursos" width="113" rendered="#{uniformesBean.solicitud.prenda.descripcion ne null}" styleClass="product-image"/> -->
                    <h:graphicImage id="imgPrenda" url="/imagen/uniforme?name=#{uniformesBean.solicitud.prenda.descripcion}.jpg" width="113" rendered="#{uniformesBean.solicitud.prenda.descripcion ne null}" styleClass="product-image" />
                </div>
            </div>
            <h:panelGroup id="fechaFinPanel" rendered="#{uniformesBean.solicitud.descripcionRechazo ne null}" style="display:block ;font-size: 3rem;font-weight: 700;">
                <div class="formgrid grid">
                    <div class="field col">
                        <p:outputLabel value="Descripcion Rechazo: " >
                            <h:outputText id="descRechazo" value="#{uniformesBean.solicitud.descripcionRechazo}" />
                        </p:outputLabel>
                    </div>
                </div>
            </h:panelGroup>
        </p:outputPanel>
        <f:facet name="footer">
            <p:commandButton value="Cancelar" icon="pi pi-check" class="ui-button-danger" actionListener="#{uniformesBean.actualizarRegistro()}"
                             update="formActividadesUniformes:tabView:dt-uniformes-sol" process="pnlCancelar @this" >
            </p:commandButton>
            <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogCambiarEstatus').hide()"
                class="ui-button-secondary" type="button" />
        </f:facet>
    </p:dialog>

</ui:composition>
