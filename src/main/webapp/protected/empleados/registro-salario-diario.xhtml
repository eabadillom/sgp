<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

								<p:dialog widgetVar="dlgSalario" header="Salario diario" modal="true" position="center top" width="30rem" showEffect="fade" hideEffect="fade">
									<p:outputPanel id="dlg-salario" styleClass="ui-fluid">
										<div>
											<span>
												<p:inputNumber value="#{registroEmpleadosBean.salarioDiario.importe}" symbol="$ " symbolPosition="p" inputStyle="text-align: right" placeholder="Importe">
													<p:ajax process="@this" />
												</p:inputNumber>
											</span>
											<span>
												<p:datePicker value="#{registroEmpleadosBean.salarioDiario.fechaRegistro}" pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX" placeholder="Fecha: dd / mm / yyyy">
													<p:ajax process="@this" />
												</p:datePicker>
											</span>
										</div>
										<div>
												<p:commandButton icon="pi pi-plus" value="Agregar" process="@this" update="form:panelDialogEmpleado form:dlg-salario form:dlSalariosDiarios" actionListener="#{registroEmpleadosBean.agregarSalarioDiario()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
										</div>
										<p:spacer height="2rem"></p:spacer>
										<p:dataTable id="dlSalariosDiarios" value="#{registroEmpleadosBean.empleado.datoEmpresa.salariosDiarios}" var="sd" emptyMessage="No hay salario diario registrado" editable="true" editMode="cell" sortBy="#{sd.fechaRegistro}" sortOrder="ascending">
	                               			<p:column headerText="Importe" sortable="true" sortBy="#{sd.importe}">
	                               				<p:cellEditor>
	                               					<f:facet name="output">
	                               						<p:outputLabel value="#{sd.importe}">
	                               							<f:convertNumber currencySymbol="$ " maxFractionDigits="2" type="currency" locale="es_MX" currencyCode="MXN"></f:convertNumber>
	                               						</p:outputLabel>
	                               					</f:facet>
	                               					<f:facet name="input">
			                               				<p:inputNumber value="#{sd.importe}"></p:inputNumber>
	                               					</f:facet>
	                               				</p:cellEditor>
	                               			</p:column>
	                               			<p:column headerText="Fecha" sortable="true" sortBy="#{sd.fechaRegistro}">
	                               				<p:cellEditor>
	                               					<f:facet name="output">
	                               						<p:outputLabel value="#{sd.fechaRegistro}">
	                               							<f:convertDateTime locale="es_MX" pattern="dd / MMM / yyyy" timeZone="GMT-6" />
	                               						</p:outputLabel>
	                               					</f:facet>
	                               					<f:facet name="input">
	                               						<p:datePicker value="#{sd.fechaRegistro}" showIcon="true">
	                               						</p:datePicker>
	                               					</f:facet>
	                               				</p:cellEditor>
	                               			</p:column>
										</p:dataTable>
									</p:outputPanel>
                                	<f:facet name="footer">
                                		<p:commandButton icon="pi pi-times" value="Cerrar" onclick="PF('dlgSalario').hide();" class="ui-button-secondary"></p:commandButton>
                                	</f:facet>
                                </p:dialog>
</ui:composition>
