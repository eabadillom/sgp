<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

                                <p:tab title="Empresarial">
                                    
                                    <div class="ui-fluid formgrid grid">
                                    	<div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="RFC" />
                                            <p:inputText id="rfc" value="#{registroEmpleadosBean.datoEmpresa.rfc}" maxlength="18" style="text-transform: uppercase" oninput="this.value = this.value.toUpperCase()">
                                                <p:ajax process="@this"/>
                                            </p:inputText>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Fecha de ingreso" />
                                            <p:datePicker id="fIngreso" value="#{registroEmpleadosBean.datoEmpresa.fechaIngreso}" weekCalculator="true" monthNavigator="true" yearNavigator="true" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy">
                                                <p:ajax process="@this" event="change" listener="#{registroEmpleadosBean.calcularPeriodoVacacional()}"/>
                                            </p:datePicker>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Fecha de baja" />
                                            <p:datePicker id="fechaBaja" value="#{registroEmpleadosBean.datoEmpresa.fechaBaja}" weekCalculator="true" monthNavigator="true" yearNavigator="true" showIcon="true" locale="es_MX" timeZone="GMT-6" pattern="dd/MM/yyyy" disabled="true">
                                                <p:ajax process="@this"/>
                                            </p:datePicker>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="NSS" />
                                            <p:inputText id="nss" value="#{registroEmpleadosBean.datoEmpresa.nss}" maxlength="15" style="text-transform: uppercase">
                                                <p:ajax process="@this"/>
                                            </p:inputText>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Salario Diario Vig." />
                                            <p:inputNumber id="salario" value="#{registroEmpleadosBean.datoEmpresa.salarioDiario}" symbol="$ " symbolPosition="p" decimalSeparator="." decimalPlaces="2" inputStyle="text-align: right" readonly="true">
                                                <p:ajax process="@this"/>
                                            </p:inputNumber>
                                        </div>
                                        <div class="field col-12 md:col-1">
                                        	<p:outputLabel for="@next" value="Modificar" style="color: rgba(255, 255, 255, 0);" />
                                        	<p:commandButton icon="pi pi-money-bill" update="form:dlg-salario" actionListener="#{registroEmpleadosBean.nuevoSalarioDiario()}" oncomplete="PF('dlgSalario').show();"/>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                        	<p:outputLabel for="@next" value="Zona Salarial"/>
                                        	<p:selectOneMenu value="#{registroEmpleadosBean.datoEmpresa.zona}" converter="entityConverter" autoWidth="false">
                                        		<f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                        		<f:selectItems value="#{registroEmpleadosBean.zonasSalario}" var="zona" itemLabel="#{zona.nombre}" itemValue="#{zona}"/>
                                        		<p:ajax process="@this" />
                                        	</p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                        	<p:outputLabel for="@next" value="Días de aguinaldo" />
                                        	<p:inputNumber id="diasAguinaldo" value="#{registroEmpleadosBean.datoEmpresa.diasAguinaldo}" symbol=" días" symbolPosition="s" placeholder="días" inputStyle="text-align: right">
                                        		<p:ajax process="@this"/>
                                        	</p:inputNumber>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                        	<p:outputLabel for="@next" value="Prima vacacional" />
                                        	<p:inputNumber id="primaVacacional" value="#{registroEmpleadosBean.datoEmpresa.primaVacacional}" symbol=" %" symbolPosition="s" placeholder="%" inputStyle="text-align: right">
                                        		<p:ajax process="@this"/>
                                        	</p:inputNumber>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Perfil" />
                                            <p:selectOneMenu id="soPerfil" value="#{registroEmpleadosBean.datoEmpresa.perfil}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstCatPerfil}" var="perfil" itemValue="#{perfil}" itemLabel="#{perfil.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Empresa" />
                                            <p:selectOneMenu id="soEmpresa" value="#{registroEmpleadosBean.datoEmpresa.empresa}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstCatEmpresa}" var="empresa" itemValue="#{empresa}" itemLabel="#{empresa.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Ubicación" />
                                            <p:selectOneMenu id="soUbica" value="#{registroEmpleadosBean.datoEmpresa.planta}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstCatPlanta}" var="planta" itemValue="#{planta}" itemLabel="#{planta.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Área" />
                                            <p:selectOneMenu id="soArea" value="#{registroEmpleadosBean.datoEmpresa.area}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstCatArea}" var="area" itemValue="#{area}" itemLabel="#{area.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Puesto" />
                                            <p:selectOneMenu id="soPuesto" value="#{registroEmpleadosBean.datoEmpresa.puesto}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstCatPuesto}" var="puesto" itemValue="#{puesto}" itemLabel="#{puesto.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Tipo de contrato" />
                                            <p:selectOneMenu id="soTipoContrato" value="#{registroEmpleadosBean.datoEmpresa.tipoContrato}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
                                                <f:selectItems value="#{registroEmpleadosBean.tiposContrato}" var="tipoContrato" itemValue="#{tipoContrato}" itemLabel="#{tipoContrato.clave} - #{tipoContrato.nombre}" />
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Tipo de jornada" />
                                            <p:selectOneMenu id="soTipoJornada" value="#{registroEmpleadosBean.datoEmpresa.tipoJornada}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.tiposJornada}" var="tipoJornada" itemValue="#{tipoJornada}" itemLabel="#{tipoJornada.clave} - #{tipoJornada.nombre}"></f:selectItems>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Tipo de régimen"/>
                                            <p:selectOneMenu id="soTipoRegimen" value="#{registroEmpleadosBean.datoEmpresa.tipoRegimen}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
                                                <f:selectItems value="#{registroEmpleadosBean.tiposRegimen}" var="tipoRegimen" itemValue="#{tipoRegimen}" itemLabel="#{tipoRegimen.clave} - #{tipoRegimen.nombre}"></f:selectItems>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Hora de entrada" />
                                            <p:datePicker id="dpHoraEntrada" value="#{registroEmpleadosBean.datoEmpresa.horaEntrada}" timeOnly="true" timeZone="GMT-6" locale="es">
                                                <p:ajax process="@this"/>
                                            </p:datePicker>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Hora de salida" />
                                            <p:datePicker id="dpHoraSalida" value="#{registroEmpleadosBean.datoEmpresa.horasalida}" timeOnly="true" timeZone="GMT-6" locale="es">
                                                <p:ajax process="@this"/>
                                            </p:datePicker>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Tolerancia"></p:outputLabel>
                                            <p:inputNumber id="minutosTolerancia" value="#{registroEmpleadosBean.datoEmpresa.minutosTolerancia}" symbol=" minutos" symbolPosition="s">
                                                <p:ajax process="@this"/>
                                            </p:inputNumber>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Ent. Federativa" />
                                            <p:selectOneMenu id="soEntidadFederativa" value="#{registroEmpleadosBean.datoEmpresa.entidadFederativa}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.entidadesFederativas}" var="entidad" itemLabel="#{entidad.clave} - #{entidad.nombre}" itemValue="#{entidad}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Riesgo puesto" />
                                            <p:selectOneMenu id="soRiesgoPuesto" value="#{registroEmpleadosBean.datoEmpresa.riesgoPuesto}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.riesgosPuesto}" var="riesgo" itemLabel="#{riesgo.clave} - #{riesgo.descripcion}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Periodicidad de pago" />
                                            <p:selectOneMenu id="soPeriodicidadPago" value="#{registroEmpleadosBean.datoEmpresa.periodicidadPago}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.periodicidadesPago}" var="periodicidad" itemLabel="#{periodicidad.periodicidad} - #{periodicidad.descripcion}" itemValue="#{periodicidad}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Banco registrado" />
                                            <p:selectOneMenu id="soBancoRegistrado" value="#{registroEmpleadosBean.datoEmpresa.banco}" autoWidth="false" converter="entityConverter">
                                                <f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
                                                <f:selectItems value="#{registroEmpleadosBean.lstBancos}" var="banco" itemLabel="#{banco.idBanco} - #{banco.descripcion}" itemValue="#{banco}"/>
                                                <p:ajax process="@this"/>
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="Sindicalizado"/><br/>
                                            <p:selectBooleanButton id="esSindicalizado" value="#{registroEmpleadosBean.datoEmpresa.sindicalizado}" onLabel="Si" offLabel="No" onIcon="pi pi-check" offIcon="pi pi-times" style="width:6rem">
                                            	<p:ajax process="@this"/>
                                            </p:selectBooleanButton>
                                        </div>
                                        <div class="field col-12 md:col-2">
                                            <p:outputLabel for="@next" value="De confianza"/><br/>
                                            <p:selectBooleanButton id="esConfianza" value="#{registroEmpleadosBean.datoEmpresa.confianza}" onLabel="Si" offLabel="No" onIcon="pi pi-check" offIcon="pi pi-times" style="width:6rem">
                                            	<p:ajax process="@this"/>
                                            </p:selectBooleanButton>
                                        </div>
                                    </div>
                                    <p:panel header="Días laborales">
                                    	<p:selectBooleanCheckbox id="labLunes" value="#{registroEmpleadosBean.datoEmpresa.diaLunes}" itemLabel="Lunes">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labMartes" value="#{registroEmpleadosBean.datoEmpresa.diaMartes}" itemLabel="Martes">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labMiercoles" value="#{registroEmpleadosBean.datoEmpresa.diaMiercoles}" itemLabel="Miércoles">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labJueves" value="#{registroEmpleadosBean.datoEmpresa.diaJueves}" itemLabel="Jueves">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labViernes" value="#{registroEmpleadosBean.datoEmpresa.diaViernes}" itemLabel="Viernes">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labSabado" value="#{registroEmpleadosBean.datoEmpresa.diaSabado}" itemLabel="Sábado">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <p:selectBooleanCheckbox id="labDomingo" value="#{registroEmpleadosBean.datoEmpresa.diaDomingo}" itemLabel="Domingo">
                                        	<p:ajax process="@this"/>
                                        </p:selectBooleanCheckbox>
                                    </p:panel>
                                    
                                </p:tab>
</ui:composition>
