<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

                        <p:dialog id="dlg-empleado" widgetVar="dialogEmpleado" header="Información #{registroEmpleadosBean.getDialogTitle()}" showEffect="fade" modal="true" responsive="true" resizable="false" width="100%" height="100%" position="center top">
                            <p:tabView id="panelDialogEmpleado" class="ui-fluid" dynamic="true" effect="drop">
                                <p:ajax event="tabChange" update="form:panelDialogEmpleado form:panelDialogEmpleado:previewFotografia" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dialogEmpleado').initPosition();"/>
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-personal.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-empresarial.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-vacaciones.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-biometrico.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-percepciones.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-prestamos.xhtml" />
                                
                                <ui:include src="/protected/empleados/registro-detalle-empleado-configuracion.xhtml" />
                            </p:tabView>
                            <f:facet name="footer">
                            	<p:commandButton value="Reingreso..." icon="pi pi-sync" process="@this" actionListener="#{registroEmpleadosBean.reingreso}" update="form:panelDialogEmpleado form:dtEmpleados" rendered="#{registroEmpleadosBean.empleado.activo eq 0}">
                            		<p:confirm header="Reingreso" message="¿Está seguro que desea registrar el reingreso del empleado?" icon="pi pi-exclamation-triangle" />
                            	</p:commandButton>
                            	<p:spacer width="20" />
                                <p:commandButton value="Guardar" icon="pi pi-save" actionListener="#{registroEmpleadosBean.guardarEmpleado()}" process="panelDialogEmpleado @this" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();">
                                	<p:confirm header="Guardar" message="¿Está seguro que desea guardar la información del empleado?" icon="pi pi-exclamation-triangle" />
                                </p:commandButton>
                                <p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dialogEmpleado').hide()" class="ui-button-secondary" resetValues="true"/>
                            </f:facet>
                        </p:dialog> 

</ui:composition>
