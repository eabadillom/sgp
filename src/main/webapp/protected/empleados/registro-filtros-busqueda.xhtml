<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

						<p:toolbar styleClass="mb-4">
                            <p:toolbarGroup align="left">
                                <p:commandButton value="Agregar" icon="pi pi-plus" actionListener="#{registroEmpleadosBean.agregarEmpleado()}" update="form:dlg-empleado form:panelDialogEmpleado" oncomplete="PF('dialogEmpleado').show()" style="margin-right: .5rem" process="@this"/>
                            </p:toolbarGroup>
                            <p:toolbarGroup align="right">
                            	<div style="padding-left: 0.5rem; padding-right: 0.5rem;">
	                                <p:selectOneMenu id="onemenuplanta" value="#{registroEmpleadosBean.planta}" converter="entityConverter" autoWidth="false">
	                                    <f:selectItem itemLabel="Todas las plantas" itemValue="#{null}"/>
	                                    <f:selectItems value="#{registroEmpleadosBean.lstCatPlanta}" var="planta" itemLabel="#{planta.descripcion}" itemValue="#{planta}"/>
	                                    <p:ajax process="@this" event="change" listener="#{registroEmpleadosBean.filtrarEmpleados()}" update="dtEmpleados"/>
	                                </p:selectOneMenu>
                            	</div>
                            	<div style="padding-left: 0.5rem; padding-right: 0.5rem;">
	                                <p:selectOneMenu id="onemenuempresa" value="#{registroEmpleadosBean.empresa}" converter="entityConverter" autoWidth="false">
	                                    <f:selectItem itemLabel="Todas las empresas" itemValue="#{null}"/>
	                                    <f:selectItems value="#{registroEmpleadosBean.lstCatEmpresa}" var="empresa" itemLabel="#{empresa.descripcion}" itemValue="#{empresa}"/>
	                                    <p:ajax process="@this" event="change" listener="#{registroEmpleadosBean.filtrarEmpleados()}" update="dtEmpleados"/>
	                                </p:selectOneMenu>
                            	</div>
                            	<div style="padding-left: 0.5rem; padding-right: 0.5rem;">
	                                <p:selectBooleanButton value="#{registroEmpleadosBean.activo}" onLabel="Activo" offLabel="Activo" onIcon="pi pi-check" offIcon="pi pi-times" style="width:6rem">
	                                	<p:ajax process="@this" event="change" listener="#{registroEmpleadosBean.filtrarEmpleados()}" update="dtEmpleados"/>
	                                </p:selectBooleanButton>
                            	</div>
                            </p:toolbarGroup>
                        </p:toolbar>

</ui:composition>
