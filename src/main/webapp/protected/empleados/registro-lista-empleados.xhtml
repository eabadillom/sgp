<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

						<p:dataTable id="dtEmpleados" widgetVar="dtEmpleados" var="empleado"
                        			reflow="true" value="#{registroEmpleadosBean.empleados}"
                        			paginator="true" rows="10"
                        			emptyMessage="No hay empleados con los criterios de búsqueda" 
                        			paginatorPosition="bottom"
                        			size="small" >

                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('dtEmpleados').filter();" style="width:auto;" placeholder="Buscar por nombre o apellidos">
                                </p:inputText>
                            </f:facet>

                            <p:column headerText="Número" width="4rem">
                                <h:outputText value="#{empleado.numEmpleado}" styleClass="customer-badge status-#{registroEmpleadosBean.obtenerStatusEmpleadoEmpresa(empleado)}"/>
                            </p:column>
                            <p:column field="primerAp" headerText="Primer Apellido">
                            </p:column>
                            <p:column field="segundoAp" headerText="Segundo Apellido">
                            </p:column>
                            <p:column field="nombre" headerText="Nombre">
                            </p:column>
                            <p:column width="2rem">
                                <p:commandButton icon="pi pi-bars" styleClass="edit-button" actionListener="#{registroEmpleadosBean.editar(empleado)}" process="@this" update="form:dlg-empleado form:panelDialogEmpleado form:panelDialogEmpleado:previewFingerprint1" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();PF('dialogEmpleado').show();">
                                </p:commandButton>
                            </p:column>
                            <p:column width="2rem">
                                <p:commandButton icon="pi pi-times" styleClass="ui-button-danger" process="@this" actionListener="#{registroEmpleadosBean.validarEmpleado(empleado)}" oncomplete="PF('dg-eliminarEmpleado').show()" update="form:dg-eliminarEmpleado" disabled="#{empleado.activo ne 1 and not empty empleado.datoEmpresa.fechaBaja}" >
                                    <f:setPropertyActionListener value="#{empleado}" target="#{registroEmpleadosBean.empleado}" />
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>

</ui:composition>
