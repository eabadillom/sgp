<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

                                <p:tab title="Personal">
                                    <h4>Información del empleado</h4>
                                    <div class="formgrid grid">
                                        <div class="field col-4">
                                            <p:outputLabel for="@next" value="Número de empleado"/>
                                            <p:inputText id="numEmp" value="#{registroEmpleadosBean.empleado.numEmpleado}" disabled="true"/>  
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Nombre"/>
                                            <p:inputText id="nombreEmp" value="#{registroEmpleadosBean.empleado.nombre}" style="text-transform: uppercase" oninput="this.value = this.value.toUpperCase()">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Primer Apellido"/>
                                            <p:inputText id="primerAp" value="#{registroEmpleadosBean.empleado.primerAp}" style="text-transform: uppercase" oninput="this.value = this.value.toUpperCase()">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Segundo Apellido"/>
                                            <p:inputText id="segundoAp" value="#{registroEmpleadosBean.empleado.segundoAp}" style="text-transform: uppercase" oninput="this.value = this.value.toUpperCase()">
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="CURP"/>
                                            <p:inputText id="curp" value="#{registroEmpleadosBean.empleado.curp}" maxlength="18" style="text-transform: uppercase" oninput="this.value = this.value.toUpperCase()">
                                                <p:ajax process="@this" />
                                            </p:inputText>  
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Fecha de nacimiento" />
                                            <p:datePicker id="fNac" value="#{registroEmpleadosBean.empleado.fechaNacimiento}" monthNavigator="true" yearNavigator="true" yearRange="1940:2015" pattern="dd/MM/yyyy" showIcon="true" locale="es" timeZone="GMT-6">
                                                <p:ajax process="@this" />
                                            </p:datePicker>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Correo"/>
                                            <p:inputText id="correo" value="#{registroEmpleadosBean.empleado.correo}">
                                                <p:ajax process="@this" />
                                            </p:inputText>  
                                        </div>
                                    </div>
                                    <h5>Domicilio fiscal</h5>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Codigo Postal"/>
                                            <p:autoComplete id="autocomplete"
                                            				value="#{registroEmpleadosBean.empleado.domicilio.asentamiento}"
                                            				completeMethod="#{registroEmpleadosBean.sugerenciasCodigoPostal}" 
                                                            placeholder="Escribe el codigo postal..."
                                                            var="sugerencia"
                                                            itemLabel="#{sugerencia.cp}"
                                                            itemValue="#{sugerencia}" 
                                                            forceSelection="true"
                                                            minQueryLength="5"
                                                            maxlength="5"
                                                            converter="entityConverter">
                                                <p:ajax process="@this" event="itemSelect" listener="#{registroEmpleadosBean.asignarDomicilio()}" update=":form:panelDialogEmpleado" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
                                                <p:column>
                                                    <p:outputLabel value="#{sugerencia.cp}"/>
                                                </p:column>
                                                <p:column>
                                                    <p:outputLabel value="#{sugerencia.descripcion}"/>
                                                </p:column>
                                            </p:autoComplete>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Pais" />
                                            <p:inputText id="pais" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.key.estado.key.pais.nombre}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Estado" />
                                            <p:inputText id="estado" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.key.estado.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Municipio" />
                                            <p:inputText id="municipio" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.key.municipio.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Localidad" />
                                            <p:inputText id="localidad" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.key.localidad.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Asentamiento" />
                                            <p:inputText id="asentamiento" value="#{registroEmpleadosBean.empleado.domicilio.asentamiento.descripcion}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                    <div class="formgrid grid">
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Calle" />
                                            <p:inputText id="calle" value="#{registroEmpleadosBean.empleado.domicilio.calle}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Num. Ext." />
                                            <p:inputText id="numExt" value="#{registroEmpleadosBean.empleado.domicilio.numeroExterior}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                        <div class="field col">
                                            <p:outputLabel for="@next" value="Num. Int" />
                                            <p:inputText id="numInt" value="#{registroEmpleadosBean.empleado.domicilio.numeroInterior}" >
                                                <p:ajax process="@this" />
                                            </p:inputText>
                                        </div>
                                    </div>
                                </p:tab>

</ui:composition>
