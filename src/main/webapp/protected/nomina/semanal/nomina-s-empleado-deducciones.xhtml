<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Deducciones">
						<p:toolbar>
							<p:toolbarGroup align="left">
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevaDeduccion()}" update="form:dlg-add-deduccion" oncomplete="PF('dlgAddDeduccion').show();">
								</p:commandButton>
							</p:toolbarGroup>
							<p:toolbarGroup align="right">
								<span style="padding-left: 0.5rem; padding-right: 0.5rem;">
									<p:selectBooleanButton onLabel="Con detalle" offLabel="Sin detalle" onIcon="pi pi-check" offIcon="pi pi-times" value="#{nominaS.detalle}">
										<p:ajax process="@this" update="form:tv-nomina" />
									</p:selectBooleanButton>
								</span>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.filtrarDeducciones()}" var="deduccion" paginator="true" paginatorPosition="bottom" rows="5" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{deduccion.tipoDeduccion.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{deduccion.nombre}"/>
							</p:column>
							<p:column headerText="Importe" width="10rem">
								<p:inputNumber value="#{deduccion.importe}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="form:tv-nomina" event="blur" listener="#{nominaS.actualizar()}"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" action="#{nominaS.eliminarDeduccion(deduccion)}" styleClass="ui-button-outlined ui-button-danger">
									<p:confirm header="Eliminar deducción" message="¿Está seguro que desea ELIMINAR la deducción #{deduccion.tipoDeduccion.clave} - #{deduccion.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="1" style="text-align:left;" footerText="Total:"/>
									<p:column colspan="1" style="text-align:left;" footerText="#{nominaS.nomina.deducciones.size()} concepto(s)"/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.deducciones.stream().filter(d -> d.procesar).map(item->item.importe).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>


</ui:composition>
