<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Percepciones">
						<p:toolbar>
							<p:toolbarGroup >
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevaPercepcion()}" update="form:dlg-add-percepcion" oncomplete="PF('dlgAddPercepcion').show();">
								</p:commandButton>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.nomina.percepciones}" var="percepcion" paginator="true" rows="5" paginatorPosition="bottom" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{percepcion.tipoPercepcion.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{percepcion.nombre}" />
							</p:column>
							<p:column headerText="Valor" width="5rem" style="text-align: right;">
								<p:inputNumber value="#{percepcion.cantidad}" decimalPlaces="3" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="form:tv-nomina" event="change" listener="#{nominaS.actualizarPorCantidad(percepcion)}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
								</p:inputNumber>
							</p:column>
							<p:column headerText="Importe" width="6rem" style="text-align: right;">
								<p:inputNumber value="#{percepcion.importe}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="form:tv-nomina" event="change" listener="#{nominaS.actualizarImporte(percepcion)}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
								</p:inputNumber>
							</p:column>
							<p:column headerText="Exento" width="6rem" style="text-align: right;">
								<p:inputNumber value="#{percepcion.importeExento}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true">
									<p:ajax process="@this" update="form:tv-nomina" event="change" listener="#{nominaS.actualizar()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
								</p:inputNumber>
							</p:column>
							<p:column headerText="Gravado" width="6rem" style="text-align: right;">
								<p:inputNumber value="#{percepcion.importeGravado}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true">
									<p:ajax process="@this" update="form:tv-nomina" event="change" listener="#{nominaS.actualizarPercepcion(percepcion)}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" actionListener="#{nominaS.eliminarPercepcion(percepcion)}" styleClass="ui-button-outlined ui-button-danger" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();">
									<p:confirm header="Eliminar percepción" message="¿Está seguro que desea ELIMINAR la percepción #{percepcion.tipoPercepcion.clave} - #{percepcion.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="1" style="text-align:left;" footerText="Total:"/>
									<p:column colspan="1" style="text-align:left;" footerText="#{nominaS.nomina.percepciones.size()} concepto(s)"/>
									<p:column colspan="1" style="text-align:right;" footerText=""/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.percepciones.stream().map(item-> (item.importe ) ).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.percepciones.stream().map(item-> (item.importeExento) ).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.percepciones.stream().map(item-> (item.importeGravado) ).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>

</ui:composition>
