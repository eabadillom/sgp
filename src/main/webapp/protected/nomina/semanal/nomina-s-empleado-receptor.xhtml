<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Receptor">
						<p:outputPanel>
							<div class="ui-fluid formgrid grid">
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Receptor"/>
									<p:inputText value="#{nominaS.nomina.receptor.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="RFC" />
									<p:inputText value="#{nominaS.nomina.receptor.rfc}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="CURP" />
									<p:inputText value="#{nominaS.nomina.receptor.curp}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Fecha inicio relación laboral" />
									<p:datePicker value="#{nominaS.nomina.receptor.inicioRelacionLaboral}" readonly="true" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Antigüedad" />
									<p:inputText value="#{nominaS.nomina.receptor.antiguedad}" readonly="true" />
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Jornada" />
									<p:inputText value="#{nominaS.nomina.receptor.tipoJornada.clave} - #{nominaS.nomina.receptor.tipoJornada.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="NSS" />
									<p:inputText value="#{nominaS.nomina.receptor.nss}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Tipo salario" />
									<p:inputText value="Tipo Salario (FIJO)" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Domicilio fiscal" />
									<p:inputText value="#{nominaS.nomina.receptor.codigoPostal}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Dias de vacaciones" />
									<p:inputNumber value="#{nominaS.nomina.receptor.diasVacaciones}" symbol=" días" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Prima vacacional" />
									<p:inputNumber value="#{nominaS.nomina.receptor.primaVacacional}" symbol=" %" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Dias de aguinaldo" />
									<p:inputNumber value="#{nominaS.nomina.receptor.diasAguinaldo}" symbol=" días" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Salario diario" />
									<p:inputNumber value="#{nominaS.nomina.receptor.salarioDiario}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Salario diario integrado" />
									<p:inputNumber value="#{nominaS.nomina.receptor.salarioDiarioIntegrado}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true"/>
								</div>
							</div>
						</p:outputPanel>
					</p:tab>


</ui:composition>
