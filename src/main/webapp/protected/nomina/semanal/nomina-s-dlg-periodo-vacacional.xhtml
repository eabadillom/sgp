<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

			<p:dialog widgetVar="dlgAddPeriodoVacacional" header="Periodo vacacional" modal="true">
				<p:outputLabel id="dlg-add-periodo-vacacional">
					<p:dataTable value="#{nominaS.periodosVacacionales}" var="periodo">
						<p:column headerText="Inicio">
							<p:outputLabel value="#{periodo.fechaInicio}">
								<f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX"/>
							</p:outputLabel>
						</p:column>
						<p:column headerText="Fin">
							<p:outputLabel value="#{periodo.fechaFin}">
								<f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX"/>
							</p:outputLabel>
						</p:column>
						<p:column headerText="Dias">
							<p:outputLabel value="#{periodo.diasTotales}">
							</p:outputLabel>
						</p:column>
						<p:column>
							<p:commandButton icon="pi pi-plus" process="@this" actionListener="#{nominaS.procesaPeriodoVacacional(periodo, 'T')}">
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</p:outputLabel>
			</p:dialog>


</ui:composition>
