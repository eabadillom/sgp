<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Otros pagos">
						<p:toolbar>
							<p:toolbarGroup >
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevoOtroPago()}" update="form:dlg-add-otro-pago" oncomplete="PF('dlgAddOtroPago').show();">
								</p:commandButton>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.filtraOtroPagos()}" var="otroPago" paginator="true" paginatorPosition="bottom" rows="5" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{otroPago.tipoOtroPago.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{otroPago.nombre}" />
							</p:column>
							<p:column headerText="Importe" width="10rem">
								<p:inputNumber value="#{otroPago.importe}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="form:tv-nomina" event="blur" listener="#{nominaS.actualizar()}"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" action="#{nominaS.eliminarOtroPago(otroPago)}" styleClass="ui-button-outlined ui-button-danger">
									<p:confirm header="Eliminar otro pago" message="¿Está seguro que desea ELIMINAR el pago #{otroPago.tipoOtroPago.clave} - #{otroPago.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="1" style="text-align:left;" footerText="Total:"/>
									<p:column colspan="1" style="text-align:left;" footerText="#{nominaS.nomina.otrosPagos.size()} concepto(s)"/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.otrosPagos.stream().map(item->item.importe).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>


</ui:composition>
