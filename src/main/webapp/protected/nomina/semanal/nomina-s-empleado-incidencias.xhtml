<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Incidencias">
						<p:toolbar>
							<p:toolbarGroup>
								<p:commandButton icon="pi pi-clock" actionListener="#{nominaS.mostrarMapaAsistencia()}" oncomplete="PF('dlgMapAsistencia').show();" update="form:dlg-lista-asistencia">
								</p:commandButton>
								<span style="width: 1rem;"></span>
								<p:commandButton icon="pi pi-calendar" actionListener="#{nominaS.mostrarDiasLaborales()}" oncomplete="PF('dlgDiasLaborales').show();" update="form:dlg-dias-laborales">
								</p:commandButton>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.nomina.incidencias}" var="incidencia">
							<p:column headerText="Dia">
								<p:outputLabel value="#{incidencia.fechaHoraEntrada}">
									<f:convertDateTime pattern="EEEE" timeZone="GMT-6" locale="es_MX"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Fecha">
								<p:outputLabel value="#{incidencia.fechaHoraEntrada}">
									<f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6" locale="es_MX"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Hora Entrada">
								<p:outputLabel value="#{incidencia.fechaHoraEntrada}">
									<f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6" locale="es_MX"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Salida">
								<p:outputLabel value="#{incidencia.fechaHoraSalida}">
									<f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6" locale="es_MX"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Status">
								<p:outputLabel value="#{incidencia.descripcion}" />
							</p:column>
						</p:dataTable>
					</p:tab>
</ui:composition>
