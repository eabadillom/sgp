<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets" 
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:jsf="http://xmlns.jcp.org/jsf">

					<p:tab title="Emisor">
						<p:outputPanel>
							<div class="ui-fluid formgrid grid">
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Emisor"/>
									<p:inputText value="#{nominaS.nomina.emisor.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Regimen Fiscal" />
									<p:inputText value="#{nominaS.nomina.emisor.regimenFiscal.clave} - #{nominaS.nomina.emisor.regimenFiscal.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="RFC"/>
									<p:inputText value="#{nominaS.nomina.emisor.rfc}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Registro Patronal" />
									<p:inputText value="#{nominaS.nomina.emisor.registroPatronal}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Lugar de expedición"/>
									<p:inputText value="#{nominaS.nomina.emisor.codigoPostal}" readonly="true"/>
								</div>
							</div>
						</p:outputPanel>
					</p:tab>

</ui:composition>
