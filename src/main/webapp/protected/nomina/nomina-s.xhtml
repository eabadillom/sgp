<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/plantillas/template.xhtml">

	<ui:define name="title">Nómina semanal</ui:define>
	<ui:define name="content">
		<script>
			PrimeFaces.locales['es'] = {
				monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
				monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
				dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
				dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
				dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
				weekHeader: 'Semana',
				firstDay: 1,
				isRTL: false,
				showMonthAfterYear: false,
				yearSuffix: '',
				timeOnlyTitle: 'Sólo hora',
				timeText: 'Tiempo',
				hourText: 'Hora',
				minuteText: 'Minuto',
				secondText: 'Segundo',
				millisecondText: 'Milisegundo',
				ampm: false,
				month: 'Mes',
				week: 'Semana',
				day: 'Día',
				allDayText: 'Todo el día',
				today: 'Hoy',
				now: 'Ahora',
				clear: 'Limpiar',
				aria: {
				   close: 'Cerrar',
				   previous: 'Anterior',
				   next: 'Siguiente',
				}
			};
		</script>
		<h:form id="formNomina">
			<p:growl id="messages" showDetail="true" life="3000"/>
			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="30rem">
				<p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes ui-button-primary" icon="pi pi-check"/>
				<p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-outlined ui-button-secondary" icon="pi pi-times" />
			</p:confirmDialog>
			<p:dialog modal="true" widgetVar="statusInfoDialog" header="Cargando información..." draggable="false" closable="false" resizable="false">
				<div align="center">
					<i class="pi pi-spinner pi-spin" style="font-size:3rem;"></i>
				</div>
			</p:dialog>
			<div class="ui-fluid formgrid grid align-items-left">
				<div class="field col-12 md:col-2">
					<p:outputLabel value="Emisor" />
					<p:selectOneMenu id="soEmpresa" value="#{nominaS.empresaSelected}" autoWidth="false" converter="entityConverter">
						<f:selectItem itemLabel="--Seleccione--"/>
						<f:selectItems value="#{nominaS.lstEmpresas}" var="empresa" itemValue="#{empresa}" itemLabel="#{empresa.descripcion}"/>
						<p:ajax event="change" process="@this" listener="#{nominaS.calculaPeriodo()}" update="anio semana dp-periodo-inicio dp-periodo-fin"/>
					</p:selectOneMenu>
				</div>
				<div class="field col-12 md:col-2">
					<p:outputLabel value="Año" />
					<p:spinner id="anio" value="#{nominaS.anio}" buttons="horizontal">
						<p:ajax event="change" process="@this" update="semana dp-periodo-inicio dp-periodo-fin" listener="#{nominaS.calculaSemanas()}"></p:ajax>
					</p:spinner>
				</div>
				<div class="field col-12 md:col-2">
					<p:outputLabel value="Periodo" />
					<p:selectOneMenu id="semana" value="#{nominaS.semana}" filter="true" filterMatchMode="contains" filterPlaceholder="Número de semana">
						<f:selectItem itemLabel="--Seleccione--" noSelectionOption="true"/>
						<f:selectItems  value="#{nominaS.semanasDelAnio}" var="periodo" itemLabel="Semana #{periodo}" itemValue="#{periodo}" />
						<p:ajax event="change"  update="anio semana dp-periodo-inicio dp-periodo-fin" process="@this" listener="#{nominaS.calculaPeriodo()}"/>
					</p:selectOneMenu>
				</div>
				<div class="field col-12 md:col-2">
					<p:outputLabel value="Del" />
					<p:inputText id="dp-periodo-inicio" value="#{nominaS.periodoInicio}" readonly="true">
						<f:convertDateTime pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6" />
					</p:inputText>
					
				</div>
				<div class="field col-12 md:col-2">
					<p:outputLabel value="al" />
					<p:inputText id="dp-periodo-fin" value="#{nominaS.periodoFin}" readonly="true">
						<f:convertDateTime pattern="dd/MM/yyyy" locale="es_MX" timeZone="GMT-6" />
					</p:inputText>
					
				</div>
				<div class="field col-12 md:col-2">
					<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
					<p:commandButton value="Calcular" process="@this" update="dtNomina" actionListener="#{nominaS.calculandoNomina()}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
				</div>
			</div>
			<div style="padding-top: 1rem;">
				<p:dataTable id="dtNomina" widgetVar="dt-Nomina" var="nomina" value="#{nominaS.listaNomina}" lazy="true" reflow="true" paginatorPosition="bottom">
					<p:column headerText="Num" width="4rem">
						<h:outputText value="#{nomina.receptor.numeroEmpleado}" styleClass="customer-badge status-#{nominaS.statusNomina(nomina)}" />
					</p:column>
					<p:column headerText="Empleado">
						<h:outputText value="#{nomina.receptor.nombre}" />
					</p:column>
					<p:column headerText="Percepciones" width="7rem" style="text-align: right;">
						<h:outputText value="#{nomina.subtotal}">
							<f:convertNumber pattern="$ #,##0.00" />
						</h:outputText>
					</p:column>
					<p:column headerText="Deducciones" width="7rem" style="text-align: right;">
						<p:outputLabel value="#{nomina.descuento}">
							<f:convertNumber pattern="$ #,##0.00" />
						</p:outputLabel>
					</p:column>
					<p:column headerText="Neto" width="7rem" style="text-align: right;">
						<p:outputLabel value="#{nomina.total}">
							<f:convertNumber pattern="$ #,##0.00" />
						</p:outputLabel>
					</p:column>
					<p:column width="3rem" style="text-align: right;">
						<p:commandButton icon="pi pi-bars" oncomplete="PF('dgEmpleado').show();" actionListener="#{nominaS.cargaEmpleadoNomina(nomina)}" process="@this" update="formNomina:dg-empleado" />
					</p:column>
					
					<p:columnGroup type="footer">
						<p:row>
							<p:column footerText="." style="color: rgba(255, 255, 255, 0);" />
							<p:column style="text-align:right;" footerText="Total:"/>
							<p:column style="text-align:right;">
								<f:facet name="footer">
									<h:outputText value="#{nominaS.listaNomina.stream().map(item -> item.subtotal).sum()}">
										<f:convertNumber pattern="$ #,##0.00" />
									</h:outputText>
								</f:facet>
							</p:column>
							<p:column style="text-align:right;">
								<f:facet name="footer">
									<h:outputText value="#{nominaS.listaNomina.stream().map(item -> item.descuento).sum()}">
										<f:convertNumber pattern="$ #,##0.00" />
									</h:outputText>
								</f:facet>
							</p:column>
							<p:column style="text-align:right;">
								<f:facet name="footer">
									<p:outputLabel value="#{nominaS.listaNomina.stream().map(item -> item.total).sum()}">
										<f:convertNumber pattern="$ #,##0.00" />
									</p:outputLabel>
								</f:facet>
							</p:column>
							<p:column width="3rem">
								<f:facet name="footer">
									<p:outputLabel value="." style="color: rgba(255, 255, 255, 0);" />
								</f:facet>
							</p:column>
						</p:row>
					</p:columnGroup>
				</p:dataTable>
			</div>
			<div align="center">
				<p:commandButton value="Guardar" icon="pi pi-pencil" actionListener="#{nominaS.guardarNominaEmpleado()}" disabled="#{nominaS.listaNomina.size() lt 0}" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
			</div>
		
			<p:dialog id="dg-empleado" widgetVar="dgEmpleado" header="#{nominaS.nomina.receptor.nombre}" modal="true" responsive="true" position="center top" height="100%" resizable="false" showEffect="fade" hideEffect="fade">
				<p:tabView id="tv-nomina" class="ui-fluid" dynamic="true" cache="true" effect="drop">
					<p:ajax event="tabChange" oncomplete="PF('dgEmpleado').initPosition();"/>
					<p:tab title="General">
						<div class="ui-fluid formgrid grid">
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Ejercicio"/>
								<p:inputText value="#{nominaS.nomina.ejercicio}" readonly="true" style="text-align: right;"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Periodo"/>
								<p:inputText value="Semana #{nominaS.nomina.periodo}" readonly="true" style="text-align: right;"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Dias laborados"/>
								<p:inputNumber value="#{nominaS.nomina.diasLaborados}" symbol=" días" symbolPosition="s" inputStyle="text-align: right"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Faltas"/>
								<p:inputNumber value="#{nominaS.nomina.diasNoLaborados}" symbol=" días" symbolPosition="s" inputStyle="text-align: right"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Dias pagados"/>
								<p:inputNumber value="#{nominaS.nomina.diasPagados}" symbol=" días" symbolPosition="s" inputStyle="text-align: right"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Subtotal"/>
								<p:inputNumber value="#{nominaS.nomina.subtotal}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," readonly="true" inputStyle="text-align: right"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Descuentos" />
								<p:inputNumber value="#{nominaS.nomina.descuento}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," readonly="true" inputStyle="text-align: right"/>
							</div>
							<div class="field col-12 md:col-3">
								<p:outputLabel value="Total" />
								<p:inputNumber value="#{nominaS.nomina.total}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," readonly="true" inputStyle="text-align: right"/>
							</div>
						</div>
					</p:tab>
					<p:tab title="Emisor">
						<p:outputPanel>
							<div class="ui-fluid formgrid grid">
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Emisor"/>
									<p:inputText value="#{nominaS.nomina.emisor.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Regimen Fiscal" />
									<p:inputText value="#{nominaS.nomina.emisor.regimenFiscal.clave} - #{nominaS.nomina.emisor.regimenFiscal.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="RFC"/>
									<p:inputText value="#{nominaS.nomina.emisor.rfc}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Registro Patronal" />
									<p:inputText value="#{nominaS.nomina.emisor.registroPatronal}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Lugar de expedición"/>
									<p:inputText value="#{nominaS.nomina.emisor.codigoPostal}" readonly="true"/>
								</div>
							</div>
						</p:outputPanel>
					</p:tab>
					<p:tab title="Receptor">
						<p:outputPanel>
							<div class="ui-fluid formgrid grid">
								<div class="field col-12 md:col-6">
									<p:outputLabel value="Receptor"/>
									<p:inputText value="#{nominaS.nomina.receptor.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="RFC" />
									<p:inputText value="#{nominaS.nomina.receptor.rfc}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="CURP" />
									<p:inputText value="#{nominaS.nomina.receptor.curp}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Fecha inicio relación laboral" />
									<p:datePicker value="#{nominaS.nomina.receptor.inicioRelacionLaboral}" readonly="true" pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Antigüedad" />
									<p:inputText value="#{nominaS.nomina.receptor.antiguedad}" readonly="true" />
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Jornada" />
									<p:inputText value="#{nominaS.nomina.receptor.tipoJornada.clave} - #{nominaS.nomina.receptor.tipoJornada.nombre}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="NSS" />
									<p:inputText value="#{nominaS.nomina.receptor.nss}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Tipo salario" />
									<p:inputText value="Tipo Salario (FIJO)" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Domicilio fiscal" />
									<p:inputText value="#{nominaS.nomina.receptor.codigoPostal}" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Dias de vacaciones" />
									<p:inputNumber value="#{nominaS.nomina.receptor.diasVacaciones}" symbol=" días" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Prima vacacional" />
									<p:inputNumber value="#{nominaS.nomina.receptor.primaVacacional}" symbol=" %" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Dias de aguinaldo" />
									<p:inputNumber value="#{nominaS.nomina.receptor.diasAguinaldo}" symbol=" días" symbolPosition="s" inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Salario diario" />
									<p:inputNumber value="#{nominaS.nomina.receptor.salarioDiario}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true"/>
								</div>
								<div class="field col-12 md:col-3">
									<p:outputLabel value="Salario diario integrado" />
									<p:inputNumber value="#{nominaS.nomina.receptor.salarioDiarioIntegrado}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="true"/>
								</div>
							</div>
						</p:outputPanel>
					</p:tab>
					<p:tab title="Incidencias">
						<p:dataTable value="#{nominaS.asistencias}" var="asistencia">
							<p:column headerText="Dia">
								<p:outputLabel value="#{asistencia.diaSemana}" />
							</p:column>
							<p:column headerText="Fecha">
								<p:outputLabel value="#{asistencia.entrada}">
									<f:convertDateTime pattern="dd/MM/yyyy" timeZone="GMT-6"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Hora Entrada">
								<p:outputLabel value="#{asistencia.entrada}">
									<f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6"/>
								</p:outputLabel>
							</p:column>
							<p:column headerText="Salida">
								<p:outputLabel value="#{asistencia.salida}">
									<f:convertDateTime pattern="HH:mm:ss" timeZone="GMT-6" />
								</p:outputLabel>
							</p:column>
							<p:column headerText="Status">
								<p:outputLabel value="#{asistencia.status.nombre}" />
							</p:column>
						</p:dataTable>
					</p:tab>
					<p:tab title="Percepciones">
						<p:toolbar>
							<p:toolbarGroup >
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevaPercepcion()}" update="formNomina:dlg-add-percepcion" oncomplete="PF('dlgAddPercepcion').show();">
								</p:commandButton>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.nomina.percepciones}" var="percepcion" paginator="true" rows="5" paginatorPosition="bottom" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{percepcion.tipoPercepcion.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{percepcion.nombre}" />
							</p:column>
							<p:column headerText="Valor" width="5rem">
								<p:inputNumber value="#{percepcion.cantidad}" decimalPlaces="3" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="formNomina:tv-nomina" event="change" listener="#{nominaS.actualizarPorCantidad(percepcion)}" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
								</p:inputNumber>
							</p:column>
							<p:column headerText="Importe excento" width="8rem">
								<p:inputNumber value="#{percepcion.importeExento}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="formNomina:tv-nomina" event="change" listener="#{nominaS.actualizar()}"/>
								</p:inputNumber>
							</p:column>
							<p:column headerText="Importe gravado" width="8rem">
								<p:inputNumber value="#{percepcion.importeGravado}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="formNomina:tv-nomina" event="change" listener="#{nominaS.actualizarPercepcion(percepcion)}"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" action="#{nominaS.eliminarPercepcion(percepcion)}" styleClass="ui-button-outlined ui-button-danger">
									<p:confirm header="Eliminar percepción" message="¿Está seguro que desea ELIMINAR la percepción #{percepcion.tipoPercepcion.clave} - #{percepcion.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="4" style="text-align:right;" footerText="Total:"/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.percepciones.stream().map(item-> (item.importeGravado.add(item.importeExento) ) ).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>
					<p:tab title="Otros pagos">
						<p:toolbar>
							<p:toolbarGroup >
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevoOtroPago()}" update="formNomina:dlg-add-otro-pago" oncomplete="PF('dlgAddOtroPago').show();">
								</p:commandButton>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.filtraOtroPagos()}" var="otroPago" paginator="true" paginatorPosition="bottom" rows="5" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{otroPago.tipoOtroPago.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{otroPago.nombre}" />
							</p:column>
							<p:column headerText="Importe" width="10rem">
								<p:inputNumber value="#{otroPago.importe}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="formNomina:tv-nomina" event="blur" listener="#{nominaS.actualizar()}"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" action="#{nominaS.eliminarOtroPago(otroPago)}" styleClass="ui-button-outlined ui-button-danger">
									<p:confirm header="Eliminar otro pago" message="¿Está seguro que desea ELIMINAR el pago #{otroPago.tipoOtroPago.clave} - #{otroPago.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="2" style="text-align:right;" footerText="Total:"/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.otrosPagos.stream().map(item->item.importe).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>
					<p:tab title="Deducciones">
						<p:toolbar>
							<p:toolbarGroup align="left">
								<p:commandButton value="Agregar" icon="pi pi-plus" process="@this" actionListener="#{nominaS.nuevaDeduccion()}" update="formNomina:dlg-add-deduccion" oncomplete="PF('dlgAddDeduccion').show();">
								</p:commandButton>
							</p:toolbarGroup>
							<p:toolbarGroup align="right">
								<span style="padding-left: 0.5rem; padding-right: 0.5rem;">
									<p:selectBooleanButton onLabel="Con detalle" offLabel="Sin detalle" onIcon="pi pi-check" offIcon="pi pi-times" value="#{nominaS.detalle}">
										<p:ajax process="@this" update="formNomina:tv-nomina" />
									</p:selectBooleanButton>
								</span>
							</p:toolbarGroup>
						</p:toolbar>
						<p:dataTable value="#{nominaS.filtrarDeducciones()}" var="deduccion" paginator="true" paginatorPosition="bottom" rows="5" lazy="true">
							<p:column headerText="SAT" width="4rem">
								<p:outputLabel value="#{deduccion.tipoDeduccion.clave}" />
							</p:column>
							<p:column headerText="Descripción">
								<p:outputLabel value="#{deduccion.nombre}"/>
							</p:column>
							<p:column headerText="Importe" width="10rem">
								<p:inputNumber value="#{deduccion.importe}" symbol="$ " decimalPlaces="2" decimalSeparator="." thousandSeparator="," inputStyle="text-align: right" readonly="#{nominaS.nomina.id ne null}">
									<p:ajax process="@this" update="formNomina:tv-nomina" event="blur" listener="#{nominaS.actualizar()}"/>
								</p:inputNumber>
							</p:column>
							<p:column width="2rem">
								<p:commandButton icon="pi pi-times" action="#{nominaS.eliminarDeduccion(deduccion)}" styleClass="ui-button-outlined ui-button-danger">
									<p:confirm header="Eliminar deducción" message="¿Está seguro que desea ELIMINAR la deducción #{deduccion.tipoDeduccion.clave} - #{deduccion.nombre}?" icon="pi pi-exclamation-triangle" />
								</p:commandButton>
							</p:column>
							<p:columnGroup type="footer">
								<p:row>
									<p:column colspan="2" style="text-align:right;" footerText="Total:"/>
									<p:column style="text-align:right;">
										<f:facet name="footer">
											<p:outputLabel value="#{nominaS.nomina.deducciones.stream().filter(d -> d.procesar).map(item->item.importe).sum()}">
												<f:convertNumber pattern="$ #,##0.00" />
											</p:outputLabel>
										</f:facet>
									</p:column>
									<p:column>
									</p:column>
								</p:row>
							</p:columnGroup>
						</p:dataTable>
					</p:tab>
				</p:tabView>
				<f:facet name="footer">
					<span style="padding-left: 0.5rem; padding-right: 0.5rem;">
						<p:commandButton value="Guardar" icon="pi pi-save" actionListener="#{nominaS.actualizarNomina}" process="@this" disabled="#{nominaS.nomina.id ne null}" update="formNomina:dtNomina" />
					</span>
					<span style="padding-left: 0.5rem; padding-right: 0.5rem;">
						<p:commandButton value="Cerrar" icon="pi pi-times" onclick="PF('dgEmpleado').hide();" styleClass="ui-button-outlined ui-button-secondary" />
					</span>
				</f:facet>
			</p:dialog>
			
			<p:dialog widgetVar="dlgAddPercepcion" header="Percepcion" modal="true">
				<p:outputPanel id="dlg-add-percepcion" styleClass="ui-fluid">
					<div class="ui-fluid formgrid grid">
						<div class="field col-12 md:col-6">
							<p:outputLabel value="Catálogo de percepciones" />
							<p:selectOneMenu id="percepcion" value="#{nominaS.percepcionCatalogo}" filter="true" filterMatchMode="contains" filterPlaceholder="Concepto" converter="entityConverter">
								<f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
								<f:selectItems value="#{nominaS.catalogoPercepciones}" var="percepcion" itemLabel="#{percepcion.nombre}" itemValue="#{percepcion}" />
								<p:ajax process="@this" event="change" update="nombrePercepcion tipoPercepcion cantidad importeExento importeGravado" listener="#{nominaS.setPercepcionCatalogo()}"/>
							</p:selectOneMenu>
						</div>
					</div>
					<p:separator />
					<div class="ui-fluid formgrid grid">
						<div class="field col-12 md:col-6">
							<p:outputLabel value="Descripción" />
							<p:inputText id="nombrePercepcion" value="#{nominaS.percepcion.nombre}">
								<p:ajax process="@this" />
							</p:inputText>
						</div>
						<div class="field col-12 md:col-6">
							<p:outputLabel value="Tipo percepción (SAT)" />
							<p:selectOneMenu id="tipoPercepcion" value="#{nominaS.percepcion.tipoPercepcion}" filter="true" filterMatchMode="contains" converter="entityConverter" autoWidth="false">
								<f:selectItem itemLabel="--Seleccione--" noSelectionOption="true" />
								<f:selectItems value="#{nominaS.tiposPercepcion}" var="tipoPercepcion" itemLabel="#{tipoPercepcion.clave} - #{tipoPercepcion.descripcion}" itemValue="#{percepcion}" />
							</p:selectOneMenu>
						</div>
						<div class="field col-12 md:col-3">
							<p:outputLabel value="Cantidad"/>
							<p:inputNumber id="cantidad" value="#{nominaS.percepcion.cantidad}" decimalPlaces="4" decimalSeparator="." placeholder="cantidad" emptyValue="null" minValue="0.0000" rendered="#{nominaE.calculoAutomatico eq false}" >
								<p:ajax process="@this" />
							</p:inputNumber>
						</div>
						<div class="field col-12 md:col-3">
							<p:outputLabel value="Importe exento"/>
							<p:inputNumber id="importeExento" value="#{nominaS.percepcion.importeExento}" decimalPlaces="2" decimalSeparator="." symbol="$ " symbolPosition="p" placeholder="importe exento" emptyValue="null" minValue="0.00" rendered="#{nominaE.calculoAutomatico eq false}">
								<p:ajax process="@this" />
							</p:inputNumber>
						</div>
						<div class="field col-12 md:col-3">
							<p:outputLabel value="Importe gravado"/>
							<p:inputNumber id="importeGravado" value="#{nominaS.percepcion.importeGravado}" decimalPlaces="2" decimalSeparator="." symbol="$ " symbolPosition="p" placeholder="importe gravado" emptyValue="null" minValue="0.00" rendered="#{nominaE.calculoAutomatico eq false}">
								<p:ajax process="@this" />
							</p:inputNumber>
						</div>
					</div>
				</p:outputPanel>
				<f:facet name="footer">
					<p:commandButton value="Aceptar" icon="pi pi-check" process="@this" actionListener="#{nominaS.agregarPercepcion()}" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
					<p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-outlined ui-button-secondary" oncomplete="PF('dlgAddPercepcion').hide();" />
				</f:facet>
			</p:dialog>
			
			<p:dialog widgetVar="dlgAddOtroPago" header="Otro pago" modal="true">
				<p:outputPanel id="dlg-add-otro-pago" styleClass="ui-fluid">
					<p:outputLabel value="Otro pago (SAT)" />
					<p:autoComplete var="otroPago" minQueryLength="3" value="#{nominaS.otroPago.tipoOtroPago}" completeMethod="#{nominaS.buscaTipoOtroPago}" itemLabel="#{otroPago.descripcion}" itemValue="#{otroPago}" converter="entityConverter" forceSelection="true" effect="fade" scrollHeight="250" placeholder="Escriba el código SAT o nombre del pago">
						<p:ajax process="@this" />
						<p:column width="3rem">
							<p:outputLabel value="#{otroPago.clave}" />
						</p:column>
						<p:column width="auto">
							<p:outputLabel value="#{otroPago.descripcion}" />
						</p:column>
					</p:autoComplete>
					<p:outputLabel value="Descripción" />
					<p:inputText value="#{nominaS.otroPago.nombre}">
						<p:ajax process="@this" />
					</p:inputText>
					<p:outputLabel value="Importe excento" />
					<p:inputNumber value="#{nominaS.otroPago.importe}" decimalPlaces="2" decimalSeparator="." symbol="$ " symbolPosition="p" placeholder="Importe" emptyValue="null" minValue="0.00">
						<p:ajax process="@this" />
					</p:inputNumber>
				</p:outputPanel>
				<f:facet name="footer">
					<p:commandButton value="Aceptar" icon="pi pi-check" process="@this" actionListener="#{nominaS.agregarOtroPago()}" onclick="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
					<p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-outlined ui-button-secondary" oncomplete="PF('dlgAddOtroPago').hide();" />
				</f:facet>
			</p:dialog>
			
			<p:dialog widgetVar="dlgAddDeduccion" header="Deduccion" modal="true">
				<p:outputPanel id="dlg-add-deduccion" styleClass="ui-fluid">
					<p:outputLabel value="Deduccion (SAT)" />
					<p:autoComplete var="deduccion" minQueryLength="3" value="#{nominaS.deduccion.tipoDeduccion}" completeMethod="#{nominaS.buscaTipoDeduccion}" itemLabel="#{deduccion.descripcion}" itemValue="#{deduccion}" converter="entityConverter" forceSelection="true" effect="fade" scrollHeight="250" placeholder="Escriba el código SAT o nombre de la deducción">
						<p:ajax process="@this" />
						<p:column width="3rem">
							<p:outputLabel value="#{deduccion.clave}"/>
						</p:column>
						<p:column width="auto">
							<p:outputLabel value="#{deduccion.descripcion}" />
						</p:column>
					</p:autoComplete>
					<p:outputLabel value="Descripcion"/>
					<p:inputText value="#{nominaS.deduccion.nombre}">
						<p:ajax process="@this" />
					</p:inputText>
					<p:outputLabel value="Importe"/>
					<p:inputNumber value="#{nominaS.deduccion.importe}" decimalPlaces="2" decimalSeparator="." symbol="$ " symbolPosition="p" placeholder="importe" emptyValue="null" minValue="0.00">
						<p:ajax process="@this" />
					</p:inputNumber>
				</p:outputPanel>
				<f:facet name="footer">
					<p:commandButton value="Aceptar" icon="pi pi-check" process="@this" actionListener="#{nominaS.agregarDeduccion()}" update="tv-nomina" />
					<p:commandButton value="Cancelar" icon="pi pi-times" styleClass="ui-button-outlined ui-button-secondary" oncomplete="PF('dlgAddDeduccion').hide();" />
				</f:facet>
			</p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
