<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:po="http://primefaces.org/omega">
    <h:form id="menuform">
    	<h:outputStylesheet library="webjars" name="font-awesome/5.12.0/css/all.min-jsf.css" />
		<h:outputStylesheet library="webjars" name="font-awesome/5.12.0/css/v4-shims.min-jsf.css" />
        <div class="sidebar">
	        <div class="sidebar-scroll-content">
	            <div class="profile">
	                <h:graphicImage value="#{SideBarBean.empleadoFoto.fotografia}" style="border-radius: 30%;width: auto; height: 7rem;"/>
	            </div>
	            <div class="menu">
	                <po:menu id="menu" widgetVar="OmegaMenuWidget">
						<p:menuitem id="asistencia" value="Mi asistencia" icon="fas fa-solid fa-calendar-check" outcome="/protected/asistencia"/>
						<p:menuitem id="uniformes" value="Solicitar uniforme" icon="fas fa-solid fa-tshirt" outcome="/protected/uniformes" rendered="#{SideBarBean.showUniformes}"/>
						<p:menuitem id="articulos" value="Solicitar articulos" icon="fas fa-solid fa-clipboard-list" outcome="/protected/articulosTrabajo" rendered="#{SideBarBean.showUniformes}"/>
						<p:menuitem id="incidencia" value="Incidencias" icon="pi pi-fw pi-exclamation-circle" outcome="/protected/incidencias" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 or SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 2 or SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 3}"/>
						<p:submenu label="Empleados" icon="fas fa-solid fa-users" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1}">
							<p:menuitem id="registroEmp" value="Registro" icon="fas fa-solid fa-user-plus" outcome="/protected/empleados/registro" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 or SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 2}"/>
							<p:menuitem id="incapacidad" value="Incapacidades" icon="fas fa-solid fa-heartbeat" outcome="/protected/settings/imss/registroIncapacidadIMSS" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1}"/>							
							<p:menuitem id="vacaciones" value="Vacaciones" icon="fas fa-solid fa-umbrella-beach" outcome="/protected/registro/vacaciones/principal.xhtml" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1}"/>
						</p:submenu>
						<p:menuitem id="cuotasImss" value="Cuotas del IMSS" icon="pi pi-book" outcome="/protected/cuotasImss" rendered="#{sideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1}"/>
						<p:submenu id="nomina" label="Nomina" icon="fas fa-solid fa-file-invoice-dollar" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 }">
							<p:menuitem id="nomina-semanal" value="Semanal" outcome="/protected/nomina/nomina-s" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 }"/>
							<p:menuitem id="nomina-extraordinaria" value="Extraordinaria" outcome="/protected/nomina/nomina-e" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 }"/>
						</p:submenu>
						<p:menuitem id="reportes" value="Reportes" icon="pi pi-chart-bar" outcome="/protected/reportes" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1 }"/>
						<p:menuitem id="ajustes" value="Ajustes" icon="pi pi-cog" outcome="/protected/settings/ajustes" rendered="#{SideBarBean.empleadoSelected.datoEmpresa.perfil.idPerfil eq 1}"></p:menuitem> 
						<p:menuitem value="Salir" icon="pi pi-fw pi-sign-out" url="#{request.contextPath}/logout" ajax="false"/>
	                </po:menu>
	            </div>
	        </div>
        </div>
    </h:form>
</ui:composition>
