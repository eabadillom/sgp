<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
			<title>Insert title here</title>
			<script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.js"></script>
			<script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
			<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.0/jquery-ui.min.js"></script>
			<link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.0/jquery-ui.css">
			<script type="text/javascript">
				var baseURL = "http://localhost:8080/sgp";
				$(document).ready(function (){
					jQuery("#dialog-message" ).dialog({
						autoOpen: false,
						modal: true,
						buttons: {
							Aceptar: function() {
								$( this ).dialog( "close" );
							}
						}
					});
				});
			
				function registryServlet(){
					console.log("Entrando a registryServlet");
					var accion = $("#accion").val();
					var numEmpleado = $("#numero").val();
					var valToken = $("#token").val();
					var parametros = {
							numero: numEmpleado,
							token: valToken,
							accion: accion
					};
					
					var path = baseURL + "/registry?" + $.param(parametros);
					$.ajax({
						async: false,
						type : "GET",
						dataType : 'json',
						contentType :"application/json;charset=utf-8",
						url : path,
						timeout: 60000,
						success : function(jsonObj) {
							var url = jsonObj.url;
							var myUrl = baseURL + "/" + url;
							
							console.log("function jsonObj..........")
							console.log("Registo exitoso");
							location.href = myUrl;
		
						},
						error : function(jsonObj) {
							myAlert("No hay respuesta del lector de huella.");
						}
					});
				}

				function myAlert(mensaje) {
					jQuery("#dialog-message").text(mensaje);
					$( "#dialog-message" ).dialog({ title: "Aviso del sistema..." });
					$( "#dialog-message" ).dialog( "open" );
				}
			</script>
		</head>
	<body>
		<form action="http://localhost:8080/sgp/registry">
			<div id="dialog-message" class="dialog-box" style="background-color: #FFFFFF; color: #000000; display: none;"></div>
			<div align="center">
				<h2>Numero de empleado</h2>
				<input type="text" id="numero" name="numero" placeholder="Número de empleado">
				<div align="center" style="padding: 1rem;">
					<h2>Token</h2>
					<input type="text" id="token" name="token" placeholder="Token"/>
				</div>
				<div align="center" style="padding: 1rem;">
					<input type="hidden" id="accion" name="accion" value="perfil">
					<label for="radioPerfil">
						<input type="radio" name="accion" id="radioPerfil" onclick="$('#accion').val('perfil')">
						Mi perfil
					</label>
					<label>
						<input type="radio" name="accion" id="radioAsistencia" onclick="$('#accion').val('registro')">
						Asistencia
					</label>
				</div>
				<div align="center" style="padding: 1rem;">
					<input type="button" value="Iniciar sesion" onclick="registryServlet();"/>
				</div>
			</div>
		
		
		</form>
	</body>
</html>
